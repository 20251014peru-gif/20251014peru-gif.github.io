<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>현장기록 카드</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f4f7fb;--surface:#fff;--ink:#182235;--sub:#6b7890;--line:#dfe7f2;--blue:#2367e8;--blue2:#eaf1ff;--orange:#e99a24;--green:#26a269;--shadow:0 10px 28px rgba(29,52,86,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:30;background:#ffffffee;border-bottom:1px solid var(--line);padding:14px 18px}.topin{max-width:1500px;margin:auto;display:flex;gap:12px;align-items:center}.brand{font-weight:900;font-size:20px}.brand small{display:block;color:var(--sub);font-weight:600;font-size:11px;margin-top:2px}.topbtn{margin-left:auto;border:0;border-radius:12px;background:var(--blue);color:#fff;padding:10px 14px;font-weight:800;text-decoration:none}.wrap{max-width:1500px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:18px}.left,.detail{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.left{padding:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;color:var(--sub)}.chip.active{background:var(--blue);border-color:var(--blue);color:#fff}.search{margin-left:auto;min-width:240px;flex:1;max-width:360px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}.syncnote{font-size:12px;color:var(--sub);margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden;cursor:pointer}.thumb{width:100%;aspect-ratio:4/3;object-fit:cover;background:#e9eef5;display:block}.ph{aspect-ratio:4/3;display:grid;place-items:center;background:#eef2f7;color:#91a0b6;font-size:42px}.ci{padding:12px}.ctitle{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--sub);margin-top:7px;display:flex;gap:8px;flex-wrap:wrap}.badges,.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.badge,.tag{font-size:11px;font-weight:900;padding:5px 8px;border-radius:8px;background:#eef3f9;color:#526177}.work{background:#e8f0ff;color:#1d56c2}.personal{background:#fff0e7;color:#b35a19}.warn{background:#fff1df;color:#a86500}.done{background:#e7f8ef;color:#167449}.detail{position:sticky;top:92px;height:calc(100vh - 112px);overflow:auto;padding:18px}.empty{min-height:320px;display:grid;place-items:center;text-align:center;color:var(--sub);grid-column:1/-1}.dhead{display:flex;gap:10px;align-items:flex-start}.dtitle{font-size:26px;font-weight:950;line-height:1.25;flex:1}.editbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:800}.subline{color:var(--sub);font-size:13px;margin:6px 0 14px}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:14px}.fact{border:1px solid var(--line);border-radius:12px;padding:10px}.fk{font-size:11px;color:var(--sub);font-weight:800}.fv{font-weight:900;margin-top:4px}.hero{width:100%;border-radius:15px;max-height:460px;object-fit:contain;background:#10151d}.strip{display:flex;gap:8px;overflow-x:auto;margin-top:8px}.strip img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:2px solid transparent}.strip img.active{border-color:var(--blue)}.memo{margin-top:14px;border:1px solid var(--line);background:#fafcff;border-radius:14px;padding:14px}.overlay{display:none;position:fixed;inset:0;background:#121b2866;z-index:100;align-items:center;justify-content:center;padding:16px}.overlay.show{display:flex}.modal{background:#fff;width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:20px}.mh,.mf{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}.mf{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end;gap:8px}.x{margin-left:auto;border:0;background:#eef2f7;width:34px;height:34px;border-radius:50%;font-size:18px}.mb{padding:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:12px}.field label{display:block;font-size:11px;color:var(--sub);font-weight:900;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;font:inherit;background:#fff}.field textarea{min-height:100px}.primary,.ghost{border:0;border-radius:12px;padding:11px 13px;font-weight:900}.primary{background:var(--blue);color:#fff}.ghost{background:#edf2f8;color:#42516a}
@media(max-width:980px){.wrap{grid-template-columns:1fr}.detail{position:static;height:auto;min-height:360px}.search{order:5;max-width:none;min-width:100%}}@media(max-width:540px){.top{padding:10px}.brand{font-size:17px}.topbtn{padding:9px 10px;font-size:12px}.wrap{padding:10px;gap:10px}.left,.detail{border-radius:14px;padding:12px}.grid{grid-template-columns:1fr 1fr;gap:9px}.ci{padding:9px}.ctitle{font-size:13px}.meta{font-size:10px}.dtitle{font-size:21px}.row{grid-template-columns:1fr}}
</style></head>
<body>
<div class="top"><div class="topin"><div class="brand">📷 현장기록 카드<small>사진이 기록이 되고, 기록이 업무가 됩니다.</small></div><a class="topbtn" href="scan-app.html">＋ 스캐너 열기</a></div></div>
<div class="wrap"><section class="left"><div class="toolbar"><button class="chip active" data-scope="all">전체 <span id="nAll"></span></button><button class="chip" data-scope="work">업무 <span id="nWork"></span></button><button class="chip" data-scope="personal">개인 <span id="nPersonal"></span></button><input class="search" id="q" placeholder="제목, 위치, 분류, 메모, 태그 검색"></div><div class="syncnote" id="syncnote">스캐너 사진을 확인하는 중…</div><div id="grid" class="grid"><div class="empty">사진 기록을 불러오는 중…</div></div></section><aside class="detail" id="detail"><div class="empty">사진 카드를 선택하세요.</div></aside></div>
<div class="overlay" id="ov"><div class="modal"><div class="mh"><b>현장기록 카드 편집</b><button class="x" id="close">×</button></div><div class="mb"><div class="field"><label>제목</label><input id="fTitle"></div><div class="row"><div class="field"><label>촬영일</label><input id="fDate" type="date"></div><div class="field"><label>촬영시간</label><input id="fTime" type="time"></div></div><div class="row"><div class="field"><label>구분</label><select id="fScope"><option value="work">업무</option><option value="personal">개인</option></select></div><div class="field"><label>상태</label><select id="fStatus"><option>발견</option><option>점검 필요</option><option>작업 중</option><option>완료</option></select></div></div><div class="row"><div class="field"><label>위치</label><input id="fLocation"></div><div class="field"><label>분류</label><input id="fCategory"></div></div><div class="field"><label>설명 / 메모</label><textarea id="fMemo"></textarea></div><div class="field"><label>태그</label><input id="fTags" placeholder="누수, 배관, 보수예정"></div></div><div class="mf"><button class="ghost" id="cancel">취소</button><button class="primary" id="save">저장</button></div></div></div>
<script>
const FB={apiKey:'AIzaSyAyG1chECYsbO7cSZUuXmNa0_KDYBmahPY',authDomain:'my-system-25497.firebaseapp.com',projectId:'my-system-25497',storageBucket:'my-system-25497.firebasestorage.app'},USER='달님';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let db,col,rows=[],selected=null,scope='all';
try{firebase.initializeApp(FB);db=firebase.firestore();col=db.collection('scanapp').doc(USER).collection('photos')}catch(e){}
function norm(d,id){const ts=d.updated||d.createdAt||d.updatedAt||Date.now(),dt=new Date(ts),date=d.cardDate||d.date||dt.toISOString().slice(0,10),time=d.cardTime||'';return{id,...d,cardTitle:d.cardTitle||d.title||'제목 없는 사진',cardDate:date,cardTime:time,cardScope:d.cardScope||d.scope||'work',cardLocation:d.cardLocation||d.location||'',cardCategory:d.cardCategory||d.cat||'기타',cardStatus:d.cardStatus||'발견',cardMemo:d.cardMemo||d.memo||'',cardTags:Array.isArray(d.cardTags)?d.cardTags:[],imgIds:Array.isArray(d.imgIds)?d.imgIds:[],imgUrls:d.imgUrls||{},images:[]}}
async function idbImage(id){return new Promise(resolve=>{try{const r=indexedDB.open('scanapp_imgs',1);r.onerror=()=>resolve('');r.onsuccess=e=>{try{const dx=e.target.result;if(!dx.objectStoreNames.contains('imgs'))return resolve('');const g=dx.transaction('imgs','readonly').objectStore('imgs').get(id);g.onsuccess=()=>resolve(g.result?.data||'');g.onerror=()=>resolve('')}catch(_){resolve('')}}}catch(_){resolve('')}})}
async function hydrateOne(r){const out=[];for(const iid of (r.imgIds||[])){let src='';try{src=await idbImage(iid)}catch(e){}if(!src)src=(r.imgUrls||{})[iid]||'';if(src)out.push(src)}r.images=out;return r}
function localRows(){try{return JSON.parse(localStorage.getItem('scanapp_photos')||'[]').filter(x=>!x.deletedAt).map(x=>norm(x,x.id))}catch(e){return[]}}
async function cloudRows(){if(!col)return[];try{const s=await col.get();return s.docs.map(d=>norm(d.data()||{},d.id)).filter(x=>!x.deletedAt)}catch(e){return[]}}
function merge(a,b){const m=new Map();[...b,...a].forEach(x=>{const old=m.get(x.id)||{};m.set(x.id,{...old,...x,imgIds:(x.imgIds&&x.imgIds.length)?x.imgIds:(old.imgIds||[]),imgUrls:{...(old.imgUrls||{}),...(x.imgUrls||{})}})});return[...m.values()].sort((x,y)=>String(y.cardDate).localeCompare(String(x.cardDate)))}
function filtered(){const q=$('q').value.trim().toLowerCase();return rows.filter(r=>(scope==='all'||r.cardScope===scope)&&(!q||[r.cardTitle,r.cardLocation,r.cardCategory,r.cardStatus,r.cardMemo,(r.cardTags||[]).join(' ')].join(' ').toLowerCase().includes(q)))}
function fmt(r){return[r.cardDate,r.cardTime].filter(Boolean).join(' ')}function sc(s){return s==='완료'?'done':s==='점검 필요'?'warn':''}
function firstImage(r){return r.images?.[0]||((r.imgIds?.[0]&&r.imgUrls)?r.imgUrls[r.imgIds[0]]:'')||''}
function render(){const a=filtered();$('nAll').textContent=`(${rows.length})`;$('nWork').textContent=`(${rows.filter(x=>x.cardScope==='work').length})`;$('nPersonal').textContent=`(${rows.filter(x=>x.cardScope==='personal').length})`;$('grid').innerHTML=a.length?a.map(r=>{const src=firstImage(r);return`<article class="card" data-id="${esc(r.id)}">${src?`<img class="thumb" src="${esc(src)}" loading="lazy">`:`<div class="ph">📷</div>`}<div class="ci"><div class="ctitle">${esc(r.cardTitle)}</div><div class="meta"><span>🗓 ${esc(fmt(r))}</span>${r.cardLocation?`<span>📍 ${esc(r.cardLocation)}</span>`:''}</div><div class="badges"><span class="badge ${r.cardScope==='work'?'work':'personal'}">${r.cardScope==='work'?'업무':'개인'}</span><span class="badge">${esc(r.cardCategory)}</span><span class="badge ${sc(r.cardStatus)}">${esc(r.cardStatus)}</span></div></div></article>`}).join(''):'<div class="empty">아직 일반사진 기록이 없습니다.<br><small>스캐너 일반사진 탭에서 사진을 추가해 주세요.</small></div>';document.querySelectorAll('.card').forEach(x=>x.onclick=()=>openDetail(x.dataset.id))}
function openDetail(id){selected=rows.find(x=>x.id===id);if(!selected)return;const r=selected,imgs=r.images?.length?r.images:(r.imgIds||[]).map(i=>(r.imgUrls||{})[i]).filter(Boolean),hero=imgs[0]||'';$('detail').innerHTML=`<div class="dhead"><div class="dtitle">${esc(r.cardTitle)}</div><button class="editbtn" id="edit">✏️ 수정</button></div><div class="subline">${esc(r.cardLocation||'위치 미입력')} · ${esc(r.cardCategory)}</div><div class="facts"><div class="fact"><div class="fk">촬영일</div><div class="fv">${esc(fmt(r))}</div></div><div class="fact"><div class="fk">구분</div><div class="fv">${r.cardScope==='work'?'업무사진':'개인사진'}</div></div><div class="fact"><div class="fk">상태</div><div class="fv">${esc(r.cardStatus)}</div></div><div class="fact"><div class="fk">사진</div><div class="fv">${imgs.length}장</div></div></div>${hero?`<img class="hero" id="hero" src="${esc(hero)}">`:'<div class="ph">📷 사진을 불러오지 못했습니다</div>'}${imgs.length>1?`<div class="strip">${imgs.map((s,i)=>`<img src="${esc(s)}" class="${i===0?'active':''}" data-src="${esc(s)}">`).join('')}</div>`:''}<div class="tags">${(r.cardTags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div><div class="memo"><b>설명 / 메모</b><div>${esc(r.cardMemo||'메모 없음')}</div></div>`;$('edit').onclick=openEdit;document.querySelectorAll('.strip img').forEach(im=>im.onclick=()=>{$('hero').src=im.dataset.src;document.querySelectorAll('.strip img').forEach(x=>x.classList.remove('active'));im.classList.add('active')})}
function openEdit(){const r=selected;if(!r)return;$('fTitle').value=r.cardTitle;$('fDate').value=r.cardDate;$('fTime').value=r.cardTime||'';$('fScope').value=r.cardScope;$('fStatus').value=r.cardStatus;$('fLocation').value=r.cardLocation;$('fCategory').value=r.cardCategory;$('fMemo').value=r.cardMemo;$('fTags').value=(r.cardTags||[]).join(', ');$('ov').classList.add('show')}
async function save(){if(!selected)return;const patch={cardTitle:$('fTitle').value.trim()||'제목 없는 사진',cardDate:$('fDate').value,cardTime:$('fTime').value,cardScope:$('fScope').value,cardStatus:$('fStatus').value,cardLocation:$('fLocation').value.trim(),cardCategory:$('fCategory').value.trim()||'기타',cardMemo:$('fMemo').value.trim(),cardTags:$('fTags').value.split(',').map(x=>x.trim()).filter(Boolean),updated:Date.now()};Object.assign(selected,patch);try{let local=JSON.parse(localStorage.getItem('scanapp_photos')||'[]'),i=local.findIndex(x=>x.id===selected.id);if(i>=0){local[i]={...local[i],...patch};localStorage.setItem('scanapp_photos',JSON.stringify(local))}}catch(e){}try{if(col)await col.doc(selected.id).set(patch,{merge:true})}catch(e){}$('ov').classList.remove('show');render();openDetail(selected.id)}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});$('q').oninput=render;$('close').onclick=$('cancel').onclick=()=>$('ov').classList.remove('show');$('save').onclick=save;
(async()=>{const local=localRows(),cloud=await cloudRows();rows=merge(local,cloud);render();let loaded=0;for(const r of rows){await hydrateOne(r);if(r.images.length)loaded++}render();$('syncnote').textContent=`일반사진 ${rows.length}건 · 사진 표시 가능 ${loaded}건 · 로컬 ${local.length} / 클라우드 ${cloud.length}`;if(rows[0])openDetail(rows[0].id)})().catch(e=>{$('syncnote').textContent='사진 불러오기 오류: '+e.message;render()});
</script></body></html>
