<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>현장기록 카드</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f4f7fb;--surface:#fff;--ink:#182235;--sub:#6b7890;--line:#dfe7f2;--blue:#2367e8;--blue2:#eaf1ff;--red:#e34c4c;--orange:#e99a24;--green:#26a269;--shadow:0 10px 28px rgba(29,52,86,.08);--radius:18px}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",sans-serif}.app{min-height:100vh}.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 18px}.topin{max-width:1500px;margin:auto;display:flex;gap:12px;align-items:center}.brand{font-weight:900;font-size:20px;white-space:nowrap}.brand small{display:block;color:var(--sub);font-weight:600;font-size:11px;margin-top:2px}.topbtn{margin-left:auto;border:0;border-radius:12px;background:var(--blue);color:#fff;padding:10px 14px;font-weight:800;text-decoration:none}.wrap{max-width:1500px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:18px}.left,.detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.left{padding:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;color:var(--sub);cursor:pointer}.chip.active{background:var(--blue);border-color:var(--blue);color:#fff}.search{margin-left:auto;min-width:240px;flex:1;max-width:360px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;outline:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden;cursor:pointer;transition:.15s}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#b8c8e5}.thumb{width:100%;aspect-ratio:4/3;object-fit:cover;background:#e9eef5;display:block}.ph{aspect-ratio:4/3;display:grid;place-items:center;background:#eef2f7;color:#91a0b6;font-size:42px}.ci{padding:12px}.ctitle{font-weight:900;font-size:15px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--sub);margin-top:7px;display:flex;gap:8px;flex-wrap:wrap}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.badge{font-size:11px;font-weight:900;padding:5px 8px;border-radius:8px;background:#eef3f9;color:#526177}.badge.work{background:#e8f0ff;color:#1d56c2}.badge.personal{background:#fff0e7;color:#b35a19}.badge.warn{background:#fff1df;color:#a86500}.badge.done{background:#e7f8ef;color:#167449}.detail{position:sticky;top:92px;height:calc(100vh - 112px);overflow:auto;padding:18px}.empty{height:100%;min-height:420px;display:grid;place-items:center;text-align:center;color:var(--sub)}.dhead{display:flex;gap:10px;align-items:flex-start}.dtitle{font-size:26px;font-weight:950;line-height:1.25;flex:1}.editbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.subline{color:var(--sub);font-size:13px;margin:6px 0 14px}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:14px}.fact{border:1px solid var(--line);border-radius:12px;padding:10px}.fk{font-size:11px;color:var(--sub);font-weight:800}.fv{font-weight:900;margin-top:4px}.hero{width:100%;border-radius:15px;max-height:430px;object-fit:contain;background:#10151d}.memo{margin-top:14px;border:1px solid var(--line);background:#fafcff;border-radius:14px;padding:14px}.memo h3{font-size:13px;margin:0 0 8px}.memo div{white-space:pre-wrap;line-height:1.65}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tag{background:var(--blue2);color:#315ca8;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:800}.actions{display:flex;gap:8px;margin-top:14px}.primary,.ghost{border:0;border-radius:12px;padding:11px 13px;font-weight:900;cursor:pointer}.primary{background:var(--blue);color:#fff}.ghost{background:#edf2f8;color:#42516a}.overlay{display:none;position:fixed;inset:0;background:rgba(18,27,40,.5);z-index:100;align-items:center;justify-content:center;padding:16px}.overlay.show{display:flex}.modal{background:#fff;width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.22)}.mh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}.mh b{font-size:18px}.x{margin-left:auto;border:0;background:#eef2f7;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}.mb{padding:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:12px}.field label{display:block;font-size:11px;color:var(--sub);font-weight:900;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;font:inherit;background:#fff}.field textarea{min-height:100px;resize:vertical}.mf{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}.loading{padding:60px;text-align:center;color:var(--sub)}
@media(max-width:980px){.wrap{grid-template-columns:1fr}.detail{position:static;height:auto;min-height:420px}.search{order:5;max-width:none;min-width:100%}}@media(max-width:540px){.top{padding:10px}.brand{font-size:17px}.topbtn{padding:9px 10px;font-size:12px}.wrap{padding:10px;gap:10px}.left,.detail{border-radius:14px;padding:12px}.grid{grid-template-columns:1fr 1fr;gap:9px}.ci{padding:9px}.ctitle{font-size:13px}.meta{font-size:10px}.dtitle{font-size:21px}.facts{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="topin"><div class="brand">📷 현장기록 카드<small>사진이 기록이 되고, 기록이 업무가 됩니다.</small></div><a class="topbtn" href="scan-app.html">＋ 스캐너 열기</a></div></div>
  <div class="wrap">
    <section class="left">
      <div class="toolbar">
        <button class="chip active" data-scope="all">전체 <span id="nAll"></span></button>
        <button class="chip" data-scope="work">업무 <span id="nWork"></span></button>
        <button class="chip" data-scope="personal">개인 <span id="nPersonal"></span></button>
        <input class="search" id="q" placeholder="제목, 위치, 분류, 메모, 태그 검색">
      </div>
      <div id="grid" class="grid"><div class="loading">사진 기록을 불러오는 중…</div></div>
    </section>
    <aside class="detail" id="detail"><div class="empty">왼쪽에서 사진 카드를 선택하세요.</div></aside>
  </div>
</div>
<div class="overlay" id="ov"><div class="modal"><div class="mh"><b>현장기록 카드 편집</b><button class="x" id="close">×</button></div><div class="mb">
  <div class="field"><label>제목</label><input id="fTitle" placeholder="예: 지하주차장 배관 누수"></div>
  <div class="row"><div class="field"><label>촬영일</label><input id="fDate" type="date"></div><div class="field"><label>촬영시간</label><input id="fTime" type="time"></div></div>
  <div class="row"><div class="field"><label>구분</label><select id="fScope"><option value="work">업무</option><option value="personal">개인</option></select></div><div class="field"><label>상태</label><select id="fStatus"><option value="발견">발견</option><option value="점검 필요">점검 필요</option><option value="작업 중">작업 중</option><option value="완료">완료</option></select></div></div>
  <div class="row"><div class="field"><label>위치</label><input id="fLocation" placeholder="예: B2 주차장"></div><div class="field"><label>분류</label><input id="fCategory" placeholder="예: 기계 / 전기 / 소방"></div></div>
  <div class="field"><label>설명 / 메모</label><textarea id="fMemo" placeholder="확인 내용, 원인, 조치 예정 등을 적어두세요."></textarea></div>
  <div class="field"><label>태그</label><input id="fTags" placeholder="누수, 배관, 보수예정 (쉼표로 구분)"></div>
</div><div class="mf"><button class="ghost" id="cancel">취소</button><button class="primary" id="save">저장</button></div></div></div>
<script>
const FB={apiKey:'AIzaSyAyG1chECYsbO7cSZUuXmNa0_KDYBmahPY',authDomain:'my-system-25497.firebaseapp.com',projectId:'my-system-25497',storageBucket:'my-system-25497.firebasestorage.app'};
const USER='달님';
firebase.initializeApp(FB); const db=firebase.firestore(); const col=db.collection('scanapp').doc(USER).collection('photos');
let rows=[],selected=null,scope='all'; const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function norm(d,id){const created=d.createdAt||d.updatedAt||Date.now(); const dt=new Date(created); const date=d.cardDate||d.date||dt.toISOString().slice(0,10); const time=d.cardTime||((d.createdAt||d.updatedAt)?dt.toTimeString().slice(0,5):''); return {id,...d,cardTitle:d.cardTitle||d.title||'제목 없는 사진',cardDate:date,cardTime:time,cardScope:d.cardScope||'work',cardLocation:d.cardLocation||'',cardCategory:d.cardCategory||d.cat||'기타',cardStatus:d.cardStatus||'발견',cardMemo:d.cardMemo||d.memo||'',cardTags:Array.isArray(d.cardTags)?d.cardTags:[],photoUrl:d.photoUrl||''}}
function statusClass(s){return s==='완료'?'done':(s==='점검 필요'?'warn':'')}
function fmtDate(r){return [r.cardDate,(r.cardTime||'')].filter(Boolean).join(' ')}
function filtered(){const q=$('q').value.trim().toLowerCase();return rows.filter(r=>(scope==='all'||r.cardScope===scope)&&(!q||[r.cardTitle,r.cardLocation,r.cardCategory,r.cardStatus,r.cardMemo,(r.cardTags||[]).join(' ')].join(' ').toLowerCase().includes(q)))}
function render(){const a=filtered();$('nAll').textContent=`(${rows.length})`;$('nWork').textContent=`(${rows.filter(x=>x.cardScope==='work').length})`;$('nPersonal').textContent=`(${rows.filter(x=>x.cardScope==='personal').length})`;$('grid').innerHTML=a.length?a.map(r=>`<article class="card" data-id="${esc(r.id)}">${r.photoUrl?`<img class="thumb" src="${esc(r.photoUrl)}" loading="lazy">`:`<div class="ph">📷</div>`}<div class="ci"><div class="ctitle">${esc(r.cardTitle)}</div><div class="meta"><span>🗓 ${esc(fmtDate(r))}</span>${r.cardLocation?`<span>📍 ${esc(r.cardLocation)}</span>`:''}</div><div class="badges"><span class="badge ${r.cardScope==='work'?'work':'personal'}">${r.cardScope==='work'?'업무':'개인'}</span><span class="badge">${esc(r.cardCategory)}</span><span class="badge ${statusClass(r.cardStatus)}">${esc(r.cardStatus)}</span></div></div></article>`).join(''):'<div class="loading">조건에 맞는 카드가 없습니다.</div>';document.querySelectorAll('.card').forEach(x=>x.onclick=()=>openDetail(x.dataset.id))}
function openDetail(id){selected=rows.find(x=>x.id===id);if(!selected)return;const r=selected;$('detail').innerHTML=`<div class="dhead"><div class="dtitle">${esc(r.cardTitle)}</div><button class="editbtn" id="edit">✏️ 수정</button></div><div class="subline">${esc(r.cardLocation||'위치 미입력')} · ${esc(r.cardCategory)}</div><div class="facts"><div class="fact"><div class="fk">촬영일</div><div class="fv">${esc(fmtDate(r))}</div></div><div class="fact"><div class="fk">구분</div><div class="fv">${r.cardScope==='work'?'업무사진':'개인사진'}</div></div><div class="fact"><div class="fk">상태</div><div class="fv">${esc(r.cardStatus)}</div></div><div class="fact"><div class="fk">원본 분류</div><div class="fv">${esc(r.cat||'-')}</div></div></div>${r.photoUrl?`<img class="hero" src="${esc(r.photoUrl)}">`:'<div class="ph">📷 사진 URL 없음</div>'}<div class="tags">${(r.cardTags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div><div class="memo"><h3>설명 / 메모</h3><div>${esc(r.cardMemo||'메모 없음')}</div></div><div class="actions"><button class="primary" id="edit2">✏️ 카드 편집</button><a class="ghost" style="text-decoration:none" href="scan-app.html">📷 스캐너 열기</a></div>`;$('edit').onclick=$('edit2').onclick=editSelected}
function editSelected(){if(!selected)return;const r=selected;$('fTitle').value=r.cardTitle;$('fDate').value=r.cardDate||'';$('fTime').value=r.cardTime||'';$('fScope').value=r.cardScope||'work';$('fStatus').value=r.cardStatus||'발견';$('fLocation').value=r.cardLocation||'';$('fCategory').value=r.cardCategory||'';$('fMemo').value=r.cardMemo||'';$('fTags').value=(r.cardTags||[]).join(', ');$('ov').classList.add('show')}
async function save(){if(!selected)return;const patch={cardTitle:$('fTitle').value.trim()||'제목 없는 사진',cardDate:$('fDate').value,cardTime:$('fTime').value,cardScope:$('fScope').value,cardStatus:$('fStatus').value,cardLocation:$('fLocation').value.trim(),cardCategory:$('fCategory').value.trim()||'기타',cardMemo:$('fMemo').value.trim(),cardTags:$('fTags').value.split(',').map(x=>x.trim()).filter(Boolean),cardUpdatedAt:Date.now()};$('save').disabled=true;try{await col.doc(selected.id).set(patch,{merge:true});Object.assign(selected,patch);$('ov').classList.remove('show');render();openDetail(selected.id)}catch(e){alert('저장 실패: '+e.message)}finally{$('save').disabled=false}}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');scope=b.dataset.scope;render()});$('q').oninput=render;$('close').onclick=$('cancel').onclick=()=>$('ov').classList.remove('show');$('save').onclick=save;$('ov').onclick=e=>{if(e.target===$('ov'))$('ov').classList.remove('show')};
col.orderBy('updatedAt','desc').limit(300).get().then(s=>{rows=s.docs.map(d=>norm(d.data(),d.id));render();if(rows.length)openDetail(rows[0].id)}).catch(async e=>{console.warn(e);try{const s=await col.limit(300).get();rows=s.docs.map(d=>norm(d.data(),d.id));rows.sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0));render();if(rows.length)openDetail(rows[0].id)}catch(e2){$('grid').innerHTML='<div class="loading">불러오기 실패: '+esc(e2.message)+'</div>'}});
</script>
</body>
</html>
