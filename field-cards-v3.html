<style>

edTitle{font-weight:900}.edTools{display:flex;gap:6px;flex-wrap:wrap;padding:8px;background:#111827;overflow:auto}.tool{border:0;border-radius:10px;padding:9px 10px;font-weight:850;background:#334155;color:#fff;white-space:nowrap}.tool.active{background:var(--blue)}.edCanvas{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:8px}.quick{display:flex;gap:6px;overflow:auto;padding:8px;background:#111827;border-top:1px solid #2c394b}.quick button{border:0;border-radius:999px;padding:8px 11px;font-weight:850;background:#334155;color:#fff;white-space:nowrap}.edBottom{display:flex;gap:8px;padding:10px;background:#151e2c}.edBottom .btn{flex:1}.detailOv{display:none;position:fixed;inset:0;z-index:150;background:#f4f7fb;overflow:auto}.detailOv.show{display:block}.detailTop{position:sticky;top:0;z-index:3;background:#ffffffee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:8px}.detailBody{max-width:980px;margin:auto;padding:14px}.detailTitle{font-size:27px;font-weight:950;margin:4px 0}.subline{color:var(--sub);margin-bottom:12px}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.fact{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.fk{font-size:11px;color:var(--sub);font-weight:800}.fv{font-weight:900;margin-top:4px}.heroWrap{background:#10151d;border-radius:16px;padding:8px;position:relative}.hero{width:100%;height:min(66vh,720px);object-fit:contain;display:block;cursor:zoom-in}.roleLabel{position:absolute;left:16px;top:16px;background:#000b;color:#fff;padding:6px 9px;border-radius:8px;font-weight:900;font-size:12px}.thumbs{display:flex;gap:8px;overflow:auto;margin:9px 0}.thumbs img{width:90px;height:68px;object-fit:cover;border-radius:9px;border:3px solid transparent}.thumbs img.on{border-color:var(--blue)}.memo{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;white-space:p <div class="top"><div class="topin"><div class="brand">📷 현장기록 카드 v3<small>촬영 → 바로 표시편집 → 카드정보 → 저장</small></div><div class="actions"><button class="btn ghost" id="reload">새로고침</button><button class="btn blue" id="captureBtn">＋ 사진 촬영</button></div></div></div>

<div id="editor" class="editor"><div class="edTop"><div class="edTitle" id="edTitle">사진 표시 편집</div><button class="x" id="edClose">×</button></div><div class="edTools"><button class="tool active" data-tool="select">선택</button><button class="tool" data-tool="arrow">➜ 화살표</button><button class="tool" data-tool="circle">⭕ 원</button><button class="tool" data-tool="number">① 번호</button><button class="tool" data-tool="text">T 글자</button><button class="tool" data-tool="draw">✏️ 펜</button><input id="color" type="color" value="#ff2525" style="width:42px;height:40px"><button class="tool" id="undo">↩</button><button class="tool" id="del">🗑</button></div><div id="canvasWrap" class="edCanvas"><canvas id="editCanvas"></canvas></div><div class="quick"><button data-q="점검 필요">점검 필요</button><button data-q="교체 필요">교체 필요</button><button data-q="작업 전">작업 전</button><button data-q="작업 후">작업 후</button><button data-q="완료">완료</button></div><div class="edBottom"><button class="btn ghost" id="edCancel">취소</button><button class="btn blue" id="edSave">표시 저장 · 다음</button></div></div>
<div id="metaOv" class="overlay"><div class="modal"><div class="mh"><b>카드 정보 입력</b><button class="x" id="metaClose">×</button></div><div class="mb"><div class="flow">사진 표시는 이미 사진에 반영되었습니다. 이제 제목·날짜·업무정보를 입력하고 카드로 저장하세요.</div><div class="field"><label>제목</label><input id="fTitle" placeholder="예: 지하주차장 배관 누수"></div><div class="row"><div class="field"><label>촬영일</label><input id="fDate" type="date"></div><div class="field"><label>촬영시간</label><input id="fTime" type="time"></div></div><div class="row"><div class="field"><label>구분</label><select id="fScope"><option value="work">업무</option><option value="personal">개인</option></select></div><div class="field"><label>상태</label><select id="fStatus"><option>발견</option><option>점검 필요</option><option>작업 중</option><option>완료</option></select></div></div><div class="row"><div class="field"><label>위치</label><input id="fLocation" placeholder="예: B2 주차장"></div><div class="field"><label>분류</label><input id="fCategory" placeholder="기계 / 전기 / 소방"></div></div><div class="field"><label>설명 / 메모</label><textarea id="fMemo" placeholder="확인 내용, 원인, 조치 예정"></textarea></div><div class="field"><label>태그</label><input id="fTags" placeholder="누수, 배관, 보수예정"></div><div class="field"><label>사진 묶음</label><div id="photoRows" class="photoRows"></div></div><button class="btn ghost" id="addMore" style="width:100%">＋ 사진 더 추가</button></div><div class="mf"><button class="btn ghost" id="metaCancel">취소</button><button class="btn blue" id="saveCard">💾 카드 저장</button></div></div></div>
<div id="detailOv" class="detailOv"><div class="detailTop"><button class="btn ghost" id="detailClose">← 목록</button><div style="font-weight:900">현장기록 카드</div><button class="btn ghost" id="editMeta" style="margin-left:auto">✏️ 정보 수정</button></div><div id="detailBody" class="detailBody"></div></div>

<script>
const FB={apiKey:'AIzaSyAyG1chECYsbO7cSZUuXmNa0_KDYBmahPY',authDomain:'my-system-25497.firebaseapp.com',projectId:'my-system-25497',storageBucket:'my-system-25497.firebasestorage.app'},USER='달님';
const $=id=>document.getElementById(id);firebase.initializeApp(FB);const db=firebase.firestore(),st=firebase.storage(),col=db.collection('scanapp').doc(USER).collection('fieldCards');let rows=[],scope='all',draftImgs=[],editIdx=0,fab=null,tool='select',dragStart=null,tempObj=null,hist=[],numSeq=1,editingCard=null,detailCard=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);function nowParts(){const d=new Date(),z=n=>String(n).padStart(2,'0');return{date:`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`,time:`${z(d.getHours())}:${z(d.getMinutes())}`}}
function sclass(s){return s==='완료'?'done':s==='점검 필요'?'warn':''}function filt(){const q=$('q').value.trim().toLowerCase();return rows.filter(r=>(scope==='all'||r.scope===scope)&&(!q||[r.title,r.location,r.category,r.status,r.memo,(r.tags||[]).join(' ')].join(' ').toLowerCase().includes(q)))}
function render(){const a=filt();$('nAll').textContent=`(${rows.length})`;$('nWork').textContent=`(${rows.filter(x=>x.scope==='work').length})`;$('nPersonal').textContent=`(${rows.filter(x=>x.scope==='personal').length})`;$('grid').innerHTML=a.length?a.map(r=>`<article class="card" data-id="${r.id}">${r.images?.[0]?.url?`<img src="${esc(r.images[0].url)}">`:`<div class="empty">📷</div>`}<div class="ci"><div class="ct">${esc(r.title||'제목 없음')}</div><div class="meta"><span>🗓 ${esc(r.date||'')} ${esc(r.time||'')}</span>${r.location?`<span>📍 ${esc(r.location)}</span>`:''}</div><div class="badges"><span class="badge ${r.scope==='work'?'work':'personal'}">${r.scope==='work'?'업무':'개인'}</span><span class="badge">${esc(r.category||'기타')}</span><span class="badge ${sclass(r.status)}">${esc(r.status||'발견')}</span></div></div></article>`).join(''):'<div class="empty">아직 카드가 없습니다.<br>위의 “＋ 사진 촬영”부터 시작하세요.</div>';document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openDetail(c.dataset.id))}
async function load(){try{const s=await col.orderBy('updated','desc').get();rows=s.docs.map(d=>({id:d.id,...d.data()}));$('status').textContent=`저장된 카드 ${rows.length}건`;render()}catch(e){$('status').textContent='불러오기 실패: '+e.message;render()}}
function openCapture(){ $('captureSheet').classList.add('show') } function closeCapture(){ $('captureSheet').classList.remove('show') }
async function filesPicked(files){if(!files||!files.length)return;closeCapture();if(!draftImgs.length){editingCard=null;const n=nowParts();$('fDate').value=n.date;$('fTime').value=n.time;$('fScope').value='work';$('fStatus').value='발견';$('fTitle').value='';$('fLocation').value='';$('fCategory').value='';$('fMemo').value='';$('fTags').value=''}for(const f of files){const data=await readAndResize(f);draftImgs.push({data,role:'일반',edited:false})}editIdx=Math.max(0,draftImgs.findIndex(x=>!x.edited));openEditor(editIdx)}
function readAndResize(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onerror=reject;fr.onload=()=>{const im=new Image();im.onload=()=>{const max=1800,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.9))};im.src=fr.result};fr.readAsDataURL(file)})}
function openEditor(idx){editIdx=idx;numSeq=1;$('editor').classList.add('show');$('edTitle').textContent=`사진 표시 편집 ${idx+1}/${draftImgs.length}`;requestAnimationFrame(()=>initFabric(draftImgs[idx].data))}
function initFabric(data){if(fab){try{fab.dispose()}catch(e){}}const wrap=$('canvasWrap'),maxW=Math.max(320,wrap.clientWidth-16),maxH=Math.max(360,wrap.clientHeight-16),im=new Image();im.onload=()=>{const s=Math.min(maxW/im.width,maxH/im.height,1),w=Math.max(300,Math.round(im.width*s)),h=Math.max(260,Math.round(im.height*s));fab=new fabric.Canvas('editCanvas',{width:w,height:h,backgroundColor:'#111'});fabric.Image.fromURL(data,bg=>{bg.set({left:0,top:0,scaleX:w/bg.width,scaleY:h/bg.height,selectable:false,evented:false});fab.add(bg);bg.sendToBack();bindFab();setTool('select');snapshot()},{crossOrigin:'anonymous'})};im.src=data}
function bindFab(){fab.off();fab.on('mouse:down',o=>{const p=fab.getPointer(o.e),color=$('color').value;if(tool==='text'){const t=prompt('사진에 넣을 글자를 입력하세요');if(t){addLabel(t,p.x,p.y,color);snapshot()}setTool('select');return}if(tool==='number'){const c=new fabric.Circle({radius:18,fill:'#ffd400',stroke:'#111',strokeWidth:2,originX:'center',originY:'center'}),t=new fabric.Text(String(numSeq++),{fontSize:22,fontWeight:'bold',fill:'#111',originX:'center',originY:'center'}),g=new fabric.Group([c,t],{left:p.x,top:p.y,originX:'center',originY:'center'});fab.add(g);snapshot();return}if(tool==='arrow'||tool==='circle'){dragStart=p;if(tool==='circle'){tempObj=new fabric.Ellipse({left:p.x,top:p.y,rx:1,ry:1,fill:'transparent',stroke:color,strokeWidth:5,originX:'left',originY:'top'});fab.add(tempObj)}}});fab.on('mouse:move',o=>{if(!dragStart||tool!=='circle'||!tempObj)return;const p=fab.getPointer(o.e);tempObj.set({left:Math.min(dragStart.x,p.x),top:Math.min(dragStart.y,p.y),rx:Math.abs(p.x-dragStart.x)/2,ry:Math.abs(p.y-dragStart.y)/2});fab.renderAll()});fab.on('mouse:up',o=>{if(!dragStart)return;const p=fab.getPointer(o.e),color=$('color').value;if(tool==='arrow'){addArrow(dragStart.x,dragStart.y,p.x,p.y,color)}dragStart=null;tempObj=null;snapshot()})}
function addArrow(x1,y1,x2,y2,color){const line=new fabric.Line([x1,y1,x2,y2],{stroke:color,strokeWidth:7,selectable:false,evented:false}),a=Math.atan2(y2-y1,x2-x1)*180/Math.PI+90,tri=new fabric.Triangle({left:x2,top:y2,originX:'center',originY:'center',width:20,height:24,fill:color,angle:a,selectable:false,evented:false});fab.add(line,tri)}
function addLabel(t,x,y,color){const txt=new fabric.Textbox(t,{left:x,top:y,width:Math.min(260,fab.width-x-10),fontSize:28,fontWeight:'bold',fill:'#fff',backgroundColor:color,padding:7,splitByGrapheme:true});fab.add(txt);fab.setActiveObject(txt)}
function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));if(!fab)return;fab.isDrawingMode=t==='draw';if(t==='draw'){fab.freeDrawingBrush.color=$('color').value;fab.freeDrawingBrush.width=6}fab.selection=t==='select';fab.forEachObject((o,i)=>{if(i===0)return;o.selectable=t==='select';o.evented=t==='select'})}
function snapshot(){if(!fab)return;hist.push(JSON.stringify(fab.toJSON()));if(hist.length>20)hist.shift()}
function bake(){fab.discardActiveObject();fab.renderAll();return fab.toDataURL({format:'jpeg',quality:.93,multiplier:2})}
function saveEdited(){draftImgs[editIdx].data=bake();draftImgs[editIdx].edited=true;const next=draftImgs.findIndex((x,i)=>i>editIdx&&!x.edited);if(next>=0){openEditor(next);return}$('editor').classList.remove('show');openMeta()}
function openMeta(){renderPhotoRows();$('metaOv').classList.add('show')}
function renderPhotoRows(){$('photoRows').innerHTML=draftImgs.map((x,i)=>`<div class="photoRow"><img src="${x.data}"><div><div style="font-weight:900;margin-bottom:8px">사진 ${i+1}</div><div class="photoCtl"><select data-role="${i}"><option ${x.role==='일반'?'selected':''}>일반</option><option ${x.role==='작업 전'?'selected':''}>작업 전</option><option ${x.role==='작업 후'?'selected':''}>작업 후</option></select><button class="btn ghost" data-reedit="${i}">표시 수정</button><button class="btn red" data-rm="${i}">삭제</button></div></div></div>`).join('');document.querySelectorAll('[data-role]').forEach(s=>s.onchange=()=>draftImgs[+s.dataset.role].role=s.value);document.querySelectorAll('[data-reedit]').forEach(b=>b.onclick=()=>{$('metaOv').classList.remove('show');openEditor(+b.dataset.reedit)});document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{draftImgs.splice(+b.dataset.rm,1);renderPhotoRows()})}
async function uploadData(data,path){const ref=st.ref(`fieldCards/${USER}/${path}`);await ref.putString(data,'data_url',{contentType:'image/jpeg'});return await ref.getDownloadURL()}
async function saveCard(){if(!draftImgs.length)return alert('사진을 추가하세요.');const title=$('fTitle').value.trim();if(!title)return alert('제목을 입력하세요.');$('saveCard').disabled=true;$('saveCard').textContent='저장 중…';try{let images=[];if(editingCard&&editingCard.images)images=[...editingCard.images];for(let i=0;i<draftImgs.length;i++){const id=uid(),url=await uploadData(draftImgs[i].data,`${id}.jpg`);images.push({id,url,role:draftImgs[i].role||'일반'})}const id=editingCard?.id||uid(),obj={title,date:$('fDate').value,time:$('fTime').value,scope:$('fScope').value,status:$('fStatus').value,location:$('fLocation').value.trim(),category:$('fCategory').value.trim()||'기타',memo:$('fMemo').value.trim(),tags:$('fTags').value.split(',').map(x=>x.trim()).filter(Boolean),images,updated:Date.now(),created:editingCard?.created||Date.now()};await col.doc(id).set(obj,{merge:true});$('metaOv').classList.remove('show');draftImgs=[];editingCard=null;await load();openDetail(id)}catch(e){alert('저장 실패: '+e.message)}finally{$('saveCard').disabled=false;$('saveCard').textContent='💾 카드 저장'}}
function openDetail(id){const r=rows.find(x=>x.id===id);if(!r)return;detailCard=r;let idx=0;function draw(){const im=r.images?.[idx];$('detailBody').innerHTML=`<div class="detailTitle">${esc(r.title||'제목 없음')}</div><div class="subline">${esc(r.location||'위치 미입력')} · ${esc(r.category||'기타')}</div><div class="facts"><div class="fact"><div class="fk">촬영일</div><div class="fv">${esc(r.date||'')} ${esc(r.time||'')}</div></div><div class="fact"><div class="fk">구분</div><div class="fv">${r.scope==='work'?'업무':'개인'}</div></div><div class="fact"><div class="fk">상태</div><div class="fv">${esc(r.status||'발견')}</div></div><div class="fact"><div class="fk">사진</div><div class="fv">${r.images?.length||0}장</div></div></div>${im?`<div class="heroWrap"><span class="roleLabel">${esc(im.role||'일반')}</span><img id="heroImg" class="hero" src="${esc(im.url)}"></div><div class="thumbs">${r.images.map((x,i)=>`<img data-ti="${i}" class="${i===idx?'on':''}" src="${esc(x.url)}">`).join('')}</div>`:''}<div class="memo"><b>설명 / 메모</b><br>${esc(r.memo||'메모 없음')}</div>`;const hero=$('heroImg');if(hero)hero.onclick=()=>{$('lbImg').src=hero.src;$('lightbox').classList.add('show')};document.querySelectorAll('[data-ti]').forEach(t=>t.onclick=()=>{idx=+t.dataset.ti;draw()})}draw();$('detailOv').classList.add('show')}
function editInfo(){if(!detailCard)return;const r=detailCard;editingCard=r;draftImgs=[];$('fTitle').value=r.title||'';$('fDate').value=r.date||'';$('fTime').value=r.time||'';$('fScope').value=r.scope||'work';$('fStatus').value=r.status||'발견';$('fLocation').value=r.location||'';$('fCategory').value=r.category||'';$('fMemo').value=r.memo||'';$('fTags').value=(r.tags||[]).join(', ');renderPhotoRows();$('detailOv').classList.remove('show');$('metaOv').classList.add('show')}
$('captureBtn').onclick=openCapture;$('sheetCancel').onclick=closeCapture;$('captureSheet').onclick=e=>{if(e.target===$('captureSheet'))closeCapture()};$('cam').onchange=e=>filesPicked(e.target.files);$('gal').onchange=e=>filesPicked(e.target.files);$('reload').onclick=load;$('q').oninput=render;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));$('color').onchange=()=>{if(fab&&fab.isDrawingMode)fab.freeDrawingBrush.color=$('color').value};$('undo').onclick=()=>{if(!fab||hist.length<2)return;hist.pop();fab.loadFromJSON(hist[hist.length-1],()=>{fab.renderAll();bindFab()})};$('del').onclick=()=>{const o=fab?.getActiveObject();if(o){fab.remove(o);snapshot()}};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{if(fab){addLabel(b.dataset.q,30,30,$('color').value);snapshot()}});$('edSave').onclick=saveEdited;$('edClose').onclick=$('edCancel').onclick=()=>{if(confirm('이 사진 편집을 취소할까요?')){$('editor').classList.remove('show');draftImgs=[]}};$('metaClose').onclick=$('metaCancel').onclick=()=>{if(confirm('카드 작성을 취소할까요?')){$('metaOv').classList.remove('show');draftImgs=[];editingCard=null}};$('addMore').onclick=()=>{$('metaOv').classList.remove('show');openCapture()};$('saveCard').onclick=saveCard;$('detailClose').onclick=()=>$('detailOv').classList.remove('show');$('editMeta').onclick=editInfo;$('lbClose').onclick=()=>$('lightbox').classList.remove('show');$('lightbox').onclick=e=>{if(e.target===$('lightbox'))$('lightbox').classList.remove('show')};load();
</script></body></html>
