<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#152238;--sub:#718096;--line:#dbe5f0;--blue:#2468ea;--blue2:#eaf1ff;--red:#ef4444;--green:#1f9d66;--orange:#e89123;--shadow:0 10px 30px rgba(29,52,86,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif}.top{position:sticky;top:0;z-index:20;background:#ffffffee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 16px}.topin{max-width:1400px;margin:auto;display:flex;align-items:center;gap:10px}.brand{font-weight:900;font-size:20px}.brand small{display:block;color:var(--sub);font-size:11px;margin-top:2px}.actions{margin-left:auto;display:flex;gap:8px}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer}.btn.blue{background:var(--blue);color:white}.btn.ghost{background:#edf2f8;color:#3f4d63}.wrap{max-width:1400px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 500px;gap:16px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.left{padding:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 12px;font-weight:800;color:var(--sub)}.chip.active{background:var(--blue);color:white;border-color:var(--blue)}.search{flex:1;min-width:200px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:white;cursor:pointer}.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#e9eef5}.ci{padding:10px}.title{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--sub);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.badge{font-size:11px;font-weight:900;padding:5px 8px;border-radius:8px;background:#eef3f9}.work{background:#e8f0ff;color:#1f55b5}.personal{background:#fff0e7;color:#b05b1b}.warn{background:#fff1df;color:#a56700}.done{background:#e7f8ef;color:#167449}.detail{padding:16px;position:sticky;top:86px;height:calc(100vh - 104px);overflow:auto}.empty{padding:60px 20px;text-align:center;color:var(--sub)}.dtitle{font-size:24px;font-weight:950}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.fact{border:1px solid var(--line);border-radius:12px;padding:9px}.fk{font-size:11px;color:var(--sub);font-weight:800}.fv{font-weight:900;margin-top:3px}.hero{width:100%;border-radius:14px;max-height:420px;object-fit:contain;background:#10151d}.thumbs{display:flex;gap:8px;margin-top:8px;overflow:auto}.thumbs img{width:74px;height:58px;border-radius:8px;object-fit:cover;border:2px solid transparent}.thumbs img.active{border-color:var(--blue)}.memo{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fafcff;white-space:pre-wrap}.overlay{display:none;position:fixed;inset:0;z-index:100;background:#0f172a88;align-items:center;justify-content:center;padding:12px}.overlay.show{display:flex}.modal{width:min(760px,100%);max-height:94vh;overflow:auto;background:white;border-radius:20px}.mh,.mf{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}.mf{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end}.mb{padding:16px}.x{margin-left:auto;border:0;background:#eef2f7;width:34px;height:34px;border-radius:50%;font-size:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:11px}.field label{display:block;font-size:11px;color:var(--sub);font-weight:900;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 11px;font:inherit;background:white}.field textarea{min-height:90px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.pitem{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#f4f7fb}.pitem img{width:100%;aspect-ratio:4/3;object-fit:cover}.pbar{display:flex;gap:5px;padding:6px}.pbar button{flex:1;border:0;border-radius:8px;padding:7px;font-weight:800}.role{position:absolute;left:6px;top:6px;background:#0009;color:white;padding:4px 7px;border-radius:7px;font-size:11px;font-weight:900}.editWrap{background:#111827}.editHead{display:flex;gap:6px;flex-wrap:wrap;padding:10px;background:#1f2937}.tool{border:0;border-radius:10px;padding:9px 10px;font-weight:800;background:#374151;color:#fff}.tool.active{background:var(--blue)}#canvasWrap{display:flex;align-items:center;justify-content:center;min-height:380px;padding:12px;overflow:auto}.quick{display:flex;gap:6px;flex-wrap:wrap;padding:10px;background:#111827}.quick button{border:0;border-radius:999px;padding:8px 10px;font-weight:800;background:#374151;color:#fff}.status{font-size:12px;color:var(--sub);margin-bottom:10px}.danger{color:#b91c1c;background:#fee2e2;padding:8px;border-radius:10px;display:none}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.detail{position:static;height:auto}.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.brand{font-size:17px}.brand small{display:none}.wrap{padding:8px}.left,.detail{border-radius:14px}.grid{grid-template-columns:1fr 1fr;gap:8px}.ci{padding:8px}.title{font-size:13px}.meta{font-size:10px}.row{grid-template-columns:1fr}.photos{grid-template-columns:1fr 1fr}.actions .ghost{display:none}}

</head><body>
<div class="top"><div class="topin"><div class="brand">📷 현장기록 카드 v2<small>촬영 → 표시 → 카드 저장 → 작업 전/후 묶음</small></div><div class="actions"><button class="btn ghost" id="reload">새로고침</button><button class="btn blue" id="newCard">＋ 새 카드</button></div></div></div>
<div class="wrap"><section class="panel left"><div class="toolbar"><button class="chip active" data-scope="all">전체 <span id="nAll">0</span></button><button class="chip" data-scope="work">업무 <span id="nWork">0</span></button><button class="chip" data-scope="personal">개인 <span id="nPersonal">0</span></button><input id="q" class="search" placeholder="제목·위치·분류·메모 검색"></div><div id="status" class="status">자료를 불러오는 중…</div><div id="err" class="danger"></div><div id="grid" class="grid"></div></section><aside id="detail" class="panel detail"><div class="empty">카드를 선택하거나 새 카드를 만드세요.</div></aside></div>
<div id="cardOv" class="overlay"><div class="modal"><div class="mh"><b id="cardOvTitle">새 현장기록 카드</b><button class="x" id="cardClose">×</button></div><div class="mb">
<div class="field"><label>제목</label><input id="fTitle" placeholder="예: 지하주차장 배관 누수"></div><div class="row"><div class="field"><label>촬영일</label><input id="fDate" type="date"></div><div class="field"><label>촬영시간</label><input id="fTime" type="time"></div></div><div class="row"><div class="field"><label>구분</label><select id="fScope"><option value="work">업무</option><option value="personal">개인</option></select></div><div class="field"><label>상태</label><select id="fStatus"><option>발견</option><option>점검 필요</option><option>작업 중</option><option>완료</option></select></div></div><div class="row"><div class="field"><label>위치</label><input id="fLocation" placeholder="예: B2 주차장"></div><div class="field"><label>분류</label><input id="fCategory" placeholder="기계 / 전기 / 소방"></div></div><div class="field"><label>설명 / 메모</label><textarea id="fMemo"></textarea></div><div class="field"><label>태그</label><input id="fTags" placeholder="누수, 배관, 보수예정"></div>
<div class="row"><div class="field"><label>📷 카메라</label><input id="cam" type="file" accept="image/*" capture="environment" multiple></div><div class="field"><label>🖼 갤러리</label><input id="gal" type="file" accept="image/*" multiple></div></div><div id="photos" class="photos"></div></div><div class="mf"><button class="btn ghost" id="cardCancel">취소</button><button class="btn blue" id="cardSave">💾 카드 저장</button></div></div></div>
<div id="editOv" class="overlay"><div class="modal editWrap"><div class="mh" style="color:#fff;border-color:#374151"><b>사진 표시 편집</b><button class="x" id="editClose">×</button></div><div class="editHead"><button class="tool active" data-tool="select">선택</button><button class="tool" data-tool="arrow">➜ 화살표</button><button class="tool" data-tool="circle">⭕ 원</button><button class="tool" data-tool="number">① 번호</button><button class="tool" data-tool="text">T 글자</button><button class="tool" data-tool="draw">✏️ 펜</button><input id="editColor" type="color" value="#ff2d2d"><button class="tool" id="undo">↩</button><button class="tool" id="delObj">🗑</button></div><div class="quick"><button data-quick="점검 필요">점검 필요</button><button data-quick="교체 필요">교체 필요</button><button data-quick="작업 전">작업 전</button><button data-quick="작업 후">작업 후</button><button data-quick="완료">완료</button></div><div id="canvasWrap"><canvas id="editCanvas"></canvas></div><div class="mf" style="border-color:#374151"><button class="btn blue" id="editSave">표시 저장</button></div></div></div>
<script>
const FB={apiKey:'AIzaSyAyG1chECYsbO7cSZUuXmNa0_KDYBmahPY',authDomain:'my-system-25497.firebaseapp.com',projectId:'my-system-25497',storageBucket:'my-system-25497.firebasestorage.app'},USER='달님';
const $=id=>document.getElementById(id);firebase.initializeApp(FB);const db=firebase.firestore(),st=firebase.storage(),col=db.collection('scanapp').doc(USER).collection('fieldCards');let rows=[],scope='all',editing=null,imgs=[],editIdx=-1,fab=null,bgImg=null,hist=[],numSeq=1,tool='select',start=null,temp=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const nowParts=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return {date:`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`,time:`${z(d.getHours())}:${z(d.getMinutes())}`}};
function showErr(m){$('err').style.display=m?'block':'none';$('err').textContent=m||''}function sclass(s){return s==='완료'?'done':s==='점검 필요'?'warn':''}function filtered(){const q=$('q').value.toLowerCase().trim();return rows.filter(r=>(scope==='all'||r.scope===scope)&&(!q||[r.title,r.location,r.category,r.status,r.memo,(r.tags||[]).join(' ')].join(' ').toLowerCase().includes(q)))}
function render(){const a=filtered();$('nAll').textContent=`(${rows.length})`;$('nWork').textContent=`(${rows.filter(x=>x.scope==='work').length})`;$('nPersonal').textContent=`(${rows.filter(x=>x.scope==='personal').length})`;$('grid').innerHTML=a.length?a.map(r=>`<article class="card" data-id="${r.id}">${r.images?.[0]?.url?`<img src="${esc(r.images[0].url)}">`:`<div class="empty">📷</div>`}<div class="ci"><div class="title">${esc(r.title||'제목 없음')}</div><div class="meta"><span>🗓 ${esc(r.date||'')} ${esc(r.time||'')}</span>${r.location?`<span>📍 ${esc(r.location)}</span>`:''}</div><div class="badges"><span class="badge ${r.scope==='work'?'work':'personal'}">${r.scope==='work'?'업무':'개인'}</span><span class="badge">${esc(r.category||'기타')}</span><span class="badge ${sclass(r.status)}">${esc(r.status||'발견')}</span></div></div></article>`).join(''):'<div class="empty">아직 카드가 없습니다.<br>＋ 새 카드로 실제 사진을 등록해보세요.</div>';document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openDetail(c.dataset.id))}
function openDetail(id){const r=rows.find(x=>x.id===id);if(!r)return;let cur=0;$('detail').innerHTML=`<div style="display:flex;gap:8px;align-items:flex-start"><div class="dtitle" style="flex:1">${esc(r.title)}</div><button id="editCard" class="btn ghost">수정</button></div><div class="meta">${esc(r.location||'위치 미입력')} · ${esc(r.category||'기타')}</div><div class="facts"><div class="fact"><div class="fk">촬영일</div><div class="fv">${esc(r.date)} ${esc(r.time||'')}</div></div><div class="fact"><div class="fk">상태</div><div class="fv">${esc(r.status)}</div></div><div class="fact"><div class="fk">구분</div><div class="fv">${r.scope==='work'?'업무사진':'개인사진'}</div></div><div class="fact"><div class="fk">사진</div><div class="fv">${r.images?.length||0}장</div></div></div>${r.images?.length?`<img id="hero" class="hero" src="${esc(r.images[0].url)}"><div class="thumbs">${r.images.map((im,i)=>`<img data-i="${i}" class="${i===0?'active':''}" src="${esc(im.url)}" title="${esc(im.role||'사진')}">`).join('')}</div>`:'<div class="empty">사진 없음</div>'}<div class="memo"><b>설명 / 메모</b>\n${esc(r.memo||'메모 없음')}</div>`;$('editCard').onclick=()=>openCard(r);document.querySelectorAll('.thumbs img').forEach(x=>x.onclick=()=>{cur=+x.dataset.i;$('hero').src=r.images[cur].url;document.querySelectorAll('.thumbs img').forEach(y=>y.classList.toggle('active',y===x))})}
async function load(){showErr('');$('status').textContent='클라우드 카드 불러오는 중…';try{const s=await col.orderBy('updatedAt','desc').get();rows=s.docs.map(d=>({id:d.id,...d.data()}));$('status').textContent=`카드 ${rows.length}건 · 사진은 Firebase Storage에 저장`;render()}catch(e){showErr('불러오기 실패: '+e.message);$('status').textContent='불러오기 실패'}}
function openCard(r=null){editing=r;r?null:editing=null;const n=nowParts();$('cardOvTitle').textContent=r?'현장기록 카드 수정':'새 현장기록 카드';$('fTitle').value=r?.title||'';$('fDate').value=r?.date||n.date;$('fTime').value=r?.time||n.time;$('fScope').value=r?.scope||'work';$('fStatus').value=r?.status||'발견';$('fLocation').value=r?.location||'';$('fCategory').value=r?.category||'';$('fMemo').value=r?.memo||'';$('fTags').value=(r?.tags||[]).join(', ');imgs=(r?.images||[]).map(x=>({...x,data:null}));renderPhotos();$('cardOv').classList.add('show')}
function renderPhotos(){$('photos').innerHTML=imgs.map((im,i)=>`<div class="pitem"><span class="role">${esc(im.role||'사진')}</span><img src="${esc(im.data||im.url)}"><div class="pbar"><button data-edit="${i}">표시</button><button data-role="${i}">${im.role==='작업 전'?'후로':'전/후'}</button><button data-del="${i}">삭제</button></div></div>`).join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(+b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{imgs.splice(+b.dataset.del,1);renderPhotos()});document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{const i=+b.dataset.role,cur=imgs[i].role||'사진';imgs[i].role=cur==='사진'?'작업 전':cur==='작업 전'?'작업 후':'사진';renderPhotos()})}
async function addFiles(list){for(const f of [...list]){if(!f.type.startsWith('image/'))continue;const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});imgs.push({id:'img_'+uid(),data,url:'',role:imgs.length===0?'작업 전':'사진'})}renderPhotos()}
$('cam').onchange=e=>addFiles(e.target.files);$('gal').onchange=e=>addFiles(e.target.files);
async function uploadImage(cardId,im){if(!im.data)return im;const ref=st.ref(`fieldCards/${USER}/${cardId}/${im.id}.jpg`);const blob=await (await fetch(im.data)).blob();await ref.put(blob,{contentType:'image/jpeg'});return {...im,url:await ref.getDownloadURL(),data:null}}
$('cardSave').onclick=async()=>{const title=$('fTitle').value.trim();if(!title)return alert('제목을 입력하세요.');if(!imgs.length)return alert('사진을 1장 이상 추가하세요.');const id=editing?.id||'fc_'+uid();const b=$('cardSave');b.disabled=true;b.textContent='저장 중…';try{const out=[];for(const im of imgs)out.push(await uploadImage(id,im));const data={title,date:$('fDate').value,time:$('fTime').value,scope:$('fScope').value,status:$('fStatus').value,location:$('fLocation').value.trim(),category:$('fCategory').value.trim()||'기타',memo:$('fMemo').value.trim(),tags:$('fTags').value.split(',').map(x=>x.trim()).filter(Boolean),images:out,updatedAt:Date.now(),createdAt:editing?.createdAt||Date.now()};await col.doc(id).set(data,{merge:true});$('cardOv').classList.remove('show');await load();openDetail(id)}catch(e){alert('저장 실패: '+e.message)}finally{b.disabled=false;b.textContent='💾 카드 저장'}};
function pushHist(){if(!fab)return;hist.push(JSON.stringify(fab.toJSON(['name'])));if(hist.length>25)hist.shift()}function setTool(t){tool=t;document.querySelectorAll('.tool[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));if(!fab)return;fab.isDrawingMode=t==='draw';fab.selection=t==='select';fab.forEachObject(o=>{if(o!==bgImg){o.selectable=t==='select';o.evented=t==='select'}});if(t==='draw'){fab.freeDrawingBrush.color=$('editColor').value;fab.freeDrawingBrush.width=5}}
function openEditor(i){editIdx=i;const src=imgs[i].data||imgs[i].url;if(!src)return;numSeq=1;hist=[];$('editOv').classList.add('show');setTimeout(()=>{if(fab)fab.dispose();const wrap=$('canvasWrap'),w=Math.min(700,wrap.clientWidth-24),h=Math.max(360,Math.min(620,window.innerHeight*.62));fab=new fabric.Canvas('editCanvas',{width:w,height:h,backgroundColor:'#111827'});fabric.Image.fromURL(src,img=>{const sc=Math.min(w/img.width,h/img.height);img.set({left:(w-img.width*sc)/2,top:(h-img.height*sc)/2,scaleX:sc,scaleY:sc,selectable:false,evented:false,name:'bg'});bgImg=img;fab.add(img);fab.sendToBack(img);fab.renderAll();pushHist();bindDraw();setTool('select')},{crossOrigin:'anonymous'})},100)}
function arrowObj(x1,y1,x2,y2){const c=$('editColor').value,ln=new fabric.Line([x1,y1,x2,y2],{stroke:c,strokeWidth:6});const a=Math.atan2(y2-y1,x2-x1)*180/Math.PI+90,tri=new fabric.Triangle({left:x2,top:y2,width:18,height:24,fill:c,angle:a,originX:'center',originY:'center'});return new fabric.Group([ln,tri],{selectable:true})}
function bindDraw(){fab.off('mouse:down');fab.off('mouse:move');fab.off('mouse:up');fab.on('mouse:down',o=>{if(tool==='select'||tool==='draw')return;const p=fab.getPointer(o.e);if(tool==='text'){const t=prompt('사진에 넣을 글자');if(t){fab.add(new fabric.IText(t,{left:p.x,top:p.y,fill:$('editColor').value,fontSize:28,fontWeight:'bold',backgroundColor:'rgba(0,0,0,.45)'}));pushHist()}return}if(tool==='number'){fab.add(new fabric.Text(String(numSeq++),{left:p.x,top:p.y,fill:'#ffe600',stroke:'#111',strokeWidth:2,fontSize:42,fontWeight:'bold',originX:'center',originY:'center'}));pushHist();return}start=p});fab.on('mouse:move',o=>{if(!start||!['arrow','circle'].includes(tool))return;const p=fab.getPointer(o.e);if(temp)fab.remove(temp);if(tool==='circle'){temp=new fabric.Ellipse({left:Math.min(start.x,p.x),top:Math.min(start.y,p.y),rx:Math.abs(p.x-start.x)/2,ry:Math.abs(p.y-start.y)/2,fill:'transparent',stroke:$('editColor').value,strokeWidth:5})}else temp=arrowObj(start.x,start.y,p.x,p.y);fab.add(temp);fab.renderAll()});fab.on('mouse:up',()=>{if(temp){temp=null;pushHist()}start=null})}
document.querySelectorAll('.tool[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));$('editColor').onchange=()=>setTool(tool);$('undo').onclick=()=>{if(hist.length<2)return;hist.pop();const j=hist[hist.length-1];fab.loadFromJSON(j,()=>{bgImg=fab.getObjects().find(o=>o.name==='bg')||fab.getObjects()[0];fab.renderAll();setTool('select')})};$('delObj').onclick=()=>{const o=fab.getActiveObject();if(o&&o!==bgImg){fab.remove(o);pushHist()}};document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{if(!fab)return;fab.add(new fabric.IText(b.dataset.quick,{left:30,top:30,fill:'#fff',fontSize:30,fontWeight:'bold',backgroundColor:'rgba(239,68,68,.88)',padding:7}));pushHist()});$('editSave').onclick=()=>{if(editIdx<0||!fab)return;fab.discardActiveObject();fab.renderAll();imgs[editIdx].data=fab.toDataURL({format:'jpeg',quality:.9,multiplier:1.5});imgs[editIdx].url='';$('editOv').classList.remove('show');renderPhotos()};
$('newCard').onclick=()=>openCard();$('reload').onclick=load;$('cardClose').onclick=$('cardCancel').onclick=()=>$('cardOv').classList.remove('show');$('editClose').onclick=()=>$('editOv').classList.remove('show');$('q').oninput=render;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});
load();
</script></body></html>
