<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
  <meta name="theme-color" content="#f8fafc">
  <title>MarkFlow — 목차가 있는 글쓰기</title>
  <link rel="stylesheet" href="markflow/editor-3.2.2.css">
  <link rel="stylesheet" href="markflow/writer.css?v=4.0.0">
  <script defer src="markflow/editor-3.2.2.js"></script>
  <script defer src="markflow/writer.js?v=4.0.0"></script>
</head>
<body>
  <header class="app-header">
    <button id="sidebar-toggle" class="icon-button" aria-label="글 목록과 목차 열기" title="글 목록과 목차" aria-expanded="true" aria-controls="sidebar" data-icon="panel"></button>
    <a class="brand" href="index.html" title="홈으로">MarkFlow<span>글에 집중하는 공간</span></a>
    <div class="header-spacer"></div>
    <span id="save-status" role="status" title="이 브라우저에 자동 저장됩니다">불러오는 중…</span>
    <button id="focus-toggle" class="icon-button" aria-label="집중 모드" title="집중 모드" aria-pressed="false" data-icon="focus"></button>
    <details id="export-menu" class="menu-wrap">
      <summary><span data-icon="export"></span><span class="export-label">내보내기</span></summary>
      <div class="dropdown">
        <button data-export="md">Markdown <small>.md</small></button>
        <button data-export="html">HTML <small>영상 포함</small></button>
        <button data-export="pdf">PDF / 인쇄</button>
        <hr>
        <button id="backup-all">전체 글 백업 <small>영상 포함</small></button>
        <button id="import-button">글 / 백업 가져오기</button>
      </div>
    </details>
  </header>
  <div id="notice" role="alert" hidden></div>
  <div class="workspace">
    <aside id="sidebar" aria-label="글 탐색">
      <div class="side-tabs" role="tablist" aria-label="탐색 방식">
        <button id="documents-tab" role="tab" aria-selected="true" aria-controls="documents-panel">내 글 <span id="doc-count">0</span></button>
        <button id="outline-tab" role="tab" aria-selected="false" aria-controls="outline-panel">목차</button>
      </div>
      <section id="documents-panel" role="tabpanel" aria-labelledby="documents-tab">
        <div class="search-row"><span data-icon="search"></span><input id="search" type="search" placeholder="글 찾기" aria-label="제목과 본문 검색"></div>
        <div class="filter-row"><select id="folder-filter" aria-label="폴더 필터"><option value="*">모든 글</option></select><button id="folder-add" class="icon-button" data-icon="folder" aria-label="폴더 만들기" title="폴더 만들기"></button></div>
        <button id="new-document" class="new-button"><span data-icon="plus"></span>새 글</button>
        <div class="list-caption">최근 수정한 순서</div>
        <nav id="document-list" aria-label="저장된 글"></nav>
      </section>
      <section id="outline-panel" role="tabpanel" aria-labelledby="outline-tab" hidden>
        <p class="side-hint">제목 1 · 2 · 3을 따라 글의 흐름을 살펴보세요.</p>
        <nav id="outline" aria-label="자동 목차"></nav>
      </section>
      <footer class="side-footer"><span class="local-dot"></span>이 브라우저에 저장 <span class="version">4.0</span></footer>
    </aside>
    <button id="backdrop" aria-label="탐색 패널 닫기" tabindex="-1" hidden></button>
    <main id="main">
      <div id="toolbar" role="toolbar" aria-label="글 서식">
        <div class="tool-group">
          <button data-command="undo" data-icon="undo" class="icon-button" title="실행취소 · Ctrl/⌘ Z" aria-label="실행취소"></button>
          <button data-command="redo" data-icon="redo" class="icon-button" title="다시실행 · Ctrl/⌘ Shift Z" aria-label="다시실행"></button>
        </div>
        <div class="tool-group"><select id="block-style" aria-label="문단 서식"><option value="0">본문</option><option value="1">제목 1</option><option value="2">제목 2</option><option value="3">제목 3</option></select></div>
        <div class="tool-group">
          <button data-command="bold" class="icon-button" title="굵게" aria-label="굵게"><b>B</b></button>
          <button data-command="italic" class="icon-button" title="기울임" aria-label="기울임"><i>I</i></button>
          <button data-command="bulletList" data-icon="list" class="icon-button" title="글머리 목록" aria-label="글머리 목록"></button>
          <button data-command="blockquote" data-icon="quote" class="icon-button" title="인용" aria-label="인용"></button>
        </div>
        <div class="tool-group">
          <button id="link-button" data-icon="link" class="icon-button" title="링크 넣기" aria-label="링크 넣기"></button>
          <button id="video-button" class="text-button" title="짧은 영상 / 유튜브"><span data-icon="video"></span>영상</button>
          <button id="spelling-button" class="text-button" title="무료 기본 맞춤법 점검"><span data-icon="check"></span>맞춤법</button>
        </div>
      </div>
      <div id="page-scroll">
        <article class="paper">
          <div class="document-meta"><span id="folder-name">미분류</span><button id="document-options" class="icon-button" data-icon="more" aria-label="현재 글 관리" title="글 이름·폴더·삭제"></button></div>
          <input id="document-title" aria-label="글 제목" placeholder="제목을 적어 주세요" autocomplete="off" spellcheck="true" maxlength="240" disabled>
          <div id="editor"><p class="loading-text">글을 불러오고 있습니다.</p></div>
          <footer class="paper-footer"><span id="char-count">0자</span><span>제목을 나누면 목차가 만들어집니다</span></footer>
        </article>
      </div>
    </main>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"><form id="dialog-form"><div class="dialog-heading"><h2 id="dialog-title"></h2><button type="button" class="icon-button" id="dialog-close" aria-label="닫기" data-icon="close"></button></div><div id="dialog-body"></div><div id="dialog-actions"></div></form></dialog>
  <input id="video-file" type="file" accept="video/*" hidden>
  <input id="import-file" type="file" accept=".md,.markdown,.txt,.json" hidden>
  <div id="toast" role="status" hidden></div>
  <section id="print-area" aria-hidden="true"></section>
</body>
</html>
