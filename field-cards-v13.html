let optionLists=JSON.parse(JSON.stringify(DEFAULT_LISTS)),pendingLists={},listRef=null,managingList=null,listDraft=[],listSyncBusy=false;
function validList(a){return Array.isArray(a)&&a.every(x=>x&&typeof x.id==='string'&&typeof x.label==='string'&&x.label.trim()&&x.label.length<=80)&&new Set(a.map(x=>x.id)).size===a.length&&new Set(a.map(x=>x.label)).size===a.length}
try{const cached=JSON.parse(localStorage.getItem(LIST_KEY)||'null');if(cached){for(const k of Object.keys(LIST_NAMES))if(validList(cached.lists?.[k]))optionLists[k]=cached.lists[k];pendingLists=cached.pending||{}}}catch(e){console.warn('목록 캐시 읽기 실패',e)}
function cacheLists(lists=optionLists,pending=pendingLists){localStorage.setItem(LIST_KEY,JSON.stringify({lists,pending}))}
function listValue(k,item){return k==='scope'?item.id:item.label}
function scopeLabel(value){return optionLists.scope.find(x=>x.id===value)?.label||({work:'업무',personal:'개인'}[value])||value||'미지정'}
function cardScopeLabel(card){return card.scopeLabel||scopeLabel(card.scope)}
function fillListField(k,reset=false){if(k==='tags'){renderTagChoices();return}const el=$(LIST_FIELDS[k]),current=reset?'':el.value,items=optionLists[k];el.replaceChildren();el.add(new Option('선택 안 함',''));for(const item of items)el.add(new Option(item.label,listValue(k,item)));if(current&&!Array.from(el.options).some(o=>o.value===current))el.add(new Option(current+' (기존 값)',current));el.value=reset?(items[0]?listValue(k,items[0]):''):current}
function renderScopeFilters(){const box=$('scopeFilters'),items=new Map(optionLists.scope.map(x=>[x.id,x.label]));for(const r of rows)if(r.scope&&!items.has(r.scope))items.set(r.scope,cardScopeLabel(r));if(scope!=='all'&&!items.has(scope))scope='all';box.replaceChildren();for(const [value,label] of [['all','전체'],...items]){const b=document.createElement('button');b.className='chip'+(scope===value?' active':'');b.textContent=label+' ('+(value==='all'?rows.length:rows.filter(r=>r.scope===value).length)+')';b.onclick=()=>{scope=value;render()};box.appendChild(b)}}
function renderTagChoices(){const box=$('tagChoices'),chosen=$('fTags').value.split(',').map(s=>s.trim());box.replaceChildren();for(const item of optionLists.tags){const b=document.createElement('button');b.type='button';b.className='chip'+(chosen.includes(item.label)?' active':'');b.textContent=item.label;b.setAttribute('aria-pressed',chosen.includes(item.label));b.onclick=()=>{const set=new Set($('fTags').value.split(',').map(s=>s.trim()).filter(Boolean));set.has(item.label)?set.delete(item.label):set.add(item.label);$('fTags').value=[...set].join(', ');renderTagChoices()};box.appendChild(b)}}
function refreshLists(){Object.keys(LIST_NAMES).forEach(k=>fillListField(k));renderScopeFilters()}
function syncMessage(message){$('listSync').textContent=message;$('listRetry').hidden=!Object.keys(pendingLists).length}
async function syncLists(){if(listSyncBusy||!Object.keys(pendingLists).length)return;if(!listRef){syncMessage('이 기기에 저장됨 · 클라우드 연결 후 다시 동기화하세요');return}listSyncBusy=true;const sending={...pendingLists};try{const payload={};for(const k of Object.keys(sending))if(validList(optionLists[k]))payload[k]=optionLists[k];await listRef.set(payload,{merge:true});for(const k of Object.keys(sending))if(pendingLists[k]===sending[k])delete pendingLists[k];cacheLists();syncMessage(Object.keys(pendingLists).length?'이 기기에 저장됨 · 동기화 대기':'목록 저장·동기화 완료')}catch(e){syncMessage('이 기기에 저장됨 · 클라우드 동기화 실패, 다시 시도할 수 있습니다')}finally{listSyncBusy=false}}
async function loadOptionLists(){if(!db)return;listRef=db.collection('scanapp').doc(USER).collection('fieldCardSettings').doc('optionLists');try{const snap=await listRef.get(),data=snap.exists?snap.data():{};for(const k of Object.keys(LIST_NAMES))if(!pendingLists[k]&&validList(data[k]))optionLists[k]=data[k];cacheLists();refreshLists();syncMessage('목록 불러오기 완료');await syncLists()}catch(e){syncMessage('이 기기 목록 사용 중 · 클라우드 연결을 확인하세요')}}
function openListManager(k){managingList=k;listDraft=JSON.parse(JSON.stringify(optionLists[k]));$('listTitle').textContent=LIST_NAMES[k]+' 목록 편집';$('listNew').value='';$('listError').textContent='';renderListDraft();$('listOv').classList.add('show')}
function renderListDraft(){const box=$('listRows');box.replaceChildren();if(!listDraft.length){const p=document.createElement('p');p.textContent='등록된 항목이 없습니다. 아래에서 추가하세요.';box.appendChild(p)}listDraft.forEach((item,i)=>{const row=document.createElement('div');row.className='listEditRow';const input=document.createElement('input');input.value=item.label;input.maxLength=80;input.setAttribute('aria-label',LIST_NAMES[managingList]+' 항목 '+(i+1));input.oninput=()=>{item.label=input.value};const del=document.createElement('button');del.type='button';del.className='btn danger';del.textContent='삭제';del.onclick=()=>{listDraft.splice(i,1);renderListDraft()};row.append(input,del);box.appendChild(row)})}
function addListDraft(){const label=$('listNew').value.trim();if(!label)return;if(listDraft.some(x=>x.label.trim()===label)){$('listError').textContent='같은 이름이 이미 있습니다.';return}listDraft.push({id:uid(),label});$('listNew').value='';$('listError').textContent='';renderListDraft()}
function saveListDraft(){const k=managingList,next=listDraft.map(x=>({...x,label:x.label.trim()}));if(!validList(next)||next.some(x=>x.label.includes(','))){$('listError').textContent='이름은 1~80자로 입력하고 중복 이름과 쉼표는 빼주세요.';return}const lists={...optionLists,[k]:next},pending={...pendingLists,[k]:uid()};try{cacheLists(lists,pending)}catch(e){$('listError').textContent='기기에 저장하지 못했습니다. 입력은 유지됩니다. 저장 공간을 확인하고 다시 시도하세요.';return}const field=$(LIST_FIELDS[k]);let selectedValue=field.value;if(k==='tags'){selectedValue=field.value.split(',').map(s=>s.trim()).filter(Boolean).map(label=>{const old=optionLists[k].find(x=>x.label===label);return old?(next.find(x=>x.id===old.id)?.label||''):label}).filter(Boolean).join(', ')}else if(k!=='scope'){const old=optionLists[k].find(x=>x.label===field.value);if(old)selectedValue=next.find(x=>x.id===old.id)?.label||''}else if(!next.some(x=>x.id===field.value))selectedValue='';field.value='';optionLists=lists;pendingLists=pending;refreshLists();field.value=selectedValue;if(k==='tags')renderTagChoices();$('listOv').classList.remove('show');syncMessage('이 기기에 저장됨 · 동기화 중');syncLists()}
document.querySelectorAll('[data-manage]').forEach(b=>b.onclick=()=>openListManager(b.dataset.manage));
$('listAdd').onclick=addListDraft;$('listNew').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addListDraft()}};
$('listSave').onclick=saveListDraft;$('listCancel').onclick=$('listClose').onclick=()=>{$('listOv').classList.remove('show')};
$('listRetry').onclick=async()=>{if(!listRef)await loadOptionLists();else await syncLists()};
$('fTags').oninput=renderTagChoices;
refreshLists();


$('status').textContent='앱 준비 완료';render();initFirebase();
</script></body></html>
