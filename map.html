<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>나의 시스템 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="app-style">
:root{
  --bg:#F1F3F7; --card:#FFFFFF; --card2:#F7F8FB; --tint:#FAFBFD;
  --ink:#131826; --ink2:#48526440; --body:#4B5567; --mute:#8B94A6;
  --sep:#E7EAF1; --sep2:#D9DEE9;
  --accent:#3B6BF5; --accent-soft:#EAF0FF;
  --live:#12A05C; --live-s:#E3F6ED;
  --dev:#C47F00;  --dev-s:#FDF2DC;
  --stop:#DC4438; --stop-s:#FDE9E7;
  --idea:#8B94A6; --idea-s:#EFF1F6;
  --r:18px; --r-sm:12px;
  --sh:0 1px 2px rgba(19,24,38,.05), 0 4px 16px rgba(19,24,38,.06);
  --sh-lift:0 12px 32px rgba(19,24,38,.20);
  --ui:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
  --lane:300px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--ui);
  font-size:16px; line-height:1.5; letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}

/* ══ 상단 바 ══ */
.bar{position:sticky;top:0;z-index:50;background:rgba(241,243,247,.88);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep2)}
.bar-in{max-width:2100px;margin:0 auto;padding:12px 20px 10px;
  display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto;min-width:0}
.brand h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.03em;white-space:nowrap}
.brand .sub{font-family:var(--mono);font-size:11px;color:var(--mute);white-space:nowrap}

/* 세그먼티드 컨트롤 (iOS) */
.tabs{display:flex;background:#E3E6EE;border-radius:11px;padding:2px;gap:2px}
.tab{min-height:36px;padding:0 18px;border-radius:9px;font-size:15px;font-weight:600;
  color:var(--body);transition:background .18s ease,box-shadow .18s ease}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);
  box-shadow:0 1px 3px rgba(19,24,38,.14)}

.acts{display:flex;gap:8px}
.btn{min-height:44px;min-width:44px;padding:0 16px;border-radius:13px;background:var(--card);
  border:.5px solid var(--sep2);font-size:15px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;box-shadow:var(--sh);
  transition:transform .1s ease,opacity .15s ease}
.btn:active{transform:scale(.96)}
.btn .ic{font-size:17px;line-height:1}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff;
  box-shadow:0 2px 10px rgba(59,107,245,.32)}
.btn.primary[data-dirty="0"]{background:var(--card);color:var(--mute);
  border-color:var(--sep2);box-shadow:none}

/* ══ 검색 + 필터 ══ */
.tools{max-width:2100px;margin:0 auto;padding:14px 20px 0;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{position:relative;flex:1 1 260px;max-width:420px}
.search input{width:100%;min-height:44px;border:none;border-radius:13px;background:#E6E9F1;
  padding:0 40px 0 40px;font:inherit;font-size:16px;color:var(--ink)}
.search input::placeholder{color:var(--mute)}
.search input:focus{outline:none;background:var(--card);box-shadow:0 0 0 3px var(--accent-soft)}
.search .mg{position:absolute;left:13px;top:50%;transform:translateY(-50%);
  font-size:15px;color:var(--mute);pointer-events:none}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;border-radius:50%;color:var(--mute);font-size:15px;display:none;
  align-items:center;justify-content:center}
.search[data-has="1"] .clr{display:flex}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chipf{min-height:38px;padding:0 14px;border-radius:19px;border:.5px solid var(--sep2);
  background:var(--card);font-size:14px;font-weight:600;color:var(--body);
  display:inline-flex;align-items:center;gap:7px;transition:opacity .15s ease}
.chipf[aria-pressed="false"]{opacity:.4}
.chipf .n{font-family:var(--mono);font-size:12px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

.hint{max-width:2100px;margin:0 auto;padding:10px 20px 0;font-size:13.5px;color:var(--mute);line-height:1.5}

/* ══ 축 바로가기 ══ */
.jump{max-width:2100px;margin:0 auto;padding:12px 20px 0;display:flex;gap:8px;
  align-items:center;flex-wrap:wrap}
.jump::-webkit-scrollbar{display:none}
.jbtn{flex:none;min-height:42px;padding:0 15px 0 12px;border-radius:21px;background:var(--jb);
  color:var(--jt);font-size:15px;font-weight:700;letter-spacing:-.02em;
  display:inline-flex;align-items:center;gap:7px;
  border:2px solid transparent;transition:transform .1s ease,border-color .15s ease,box-shadow .15s ease}
.jbtn:active{transform:scale(.95)}
.jbtn[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 3px 12px rgba(19,24,38,.16)}
.jbtn .e{font-size:16px;line-height:1}
.jbtn .n{font-family:var(--mono);font-size:12.5px;font-weight:500;opacity:.72}
.jbtn.all{--jb:#E1E5EE;--jt:#2A3346}

/* ══ 축 상세 (가로 목록) ══ */
.sect{display:flex;align-items:center;gap:13px;margin:20px 20px 14px;
  background:var(--sb);border-radius:18px;padding:16px 22px}
.sect .e{font-size:30px;line-height:1}
.sect .t{font-size:25px;font-weight:700;color:var(--st);letter-spacing:-.035em}
.sect .c{margin-left:auto;font-size:15px;font-weight:700;color:var(--st);opacity:.72;
  background:rgba(255,255,255,.55);padding:5px 13px;border-radius:20px}
.grid{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:12px;padding:0 20px 8px;align-content:start}
.grid .addbtn{min-height:96px}
.axis{margin-bottom:26px}
.sect.tap{cursor:pointer;transition:transform .1s ease}
.sect.tap:active{transform:scale(.995)}
.sect .cv{font-size:19px;font-weight:700;color:var(--st);opacity:.6;margin-left:12px;line-height:1}

.hint{padding-top:12px}

/* ══ 루트 ══ */
.wrap{max-width:2100px;margin:0 auto;padding:0 0 80px}
.rootrow{display:flex;justify-content:center;padding:22px 20px 0}
.rootcard{background:var(--card);border-radius:var(--r);padding:14px 24px;box-shadow:var(--sh);
  text-align:center;border:.5px solid var(--sep)}
.rootcard .t{font-size:18px;font-weight:700;letter-spacing:-.02em}
.rootcard .u{font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:2px;word-break:break-all}
.stem{width:2px;height:20px;background:var(--sep2);margin:0 auto;border-radius:2px}

/* ══ 레인 보드 ══ */
.lanes-scroll{overflow-x:auto;overflow-y:visible;padding:0 20px 20px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.lanes-scroll::-webkit-scrollbar{height:8px}
.lanes-scroll::-webkit-scrollbar-thumb{background:var(--sep2);border-radius:4px}
.bus{position:relative;height:0}
.bus i{position:absolute;height:2px;background:var(--sep2);border-radius:2px;display:block}
.lanes{display:flex;gap:14px;min-width:min-content;padding-top:14px}
.lane{width:var(--lane);flex:none;display:flex;flex-direction:column;scroll-snap-align:start}

.lane-head{border-radius:16px;padding:15px 17px;background:var(--lb);
  display:flex;align-items:center;gap:11px;position:relative}
.lane-head::before{content:"";position:absolute;left:50%;top:-14px;width:2px;height:14px;
  background:var(--sep2);border-radius:2px}
.lane-head .em{font-size:25px;line-height:1}
.lane-head .n{font-size:19.5px;font-weight:700;color:var(--lt);letter-spacing:-.035em}
.lane-head .c{margin-left:auto;font-size:14px;font-weight:700;color:var(--lt);opacity:.75;
  background:rgba(255,255,255,.55);padding:3px 11px;border-radius:20px}

.lane-body{display:flex;flex-direction:column;gap:10px;padding:12px 0 4px;min-height:60px}
.lane-body.over{background:var(--accent-soft);border-radius:16px;padding:12px 8px 4px}

/* ══ 즐겨찾기 줄 ══ */
.favbar{max-width:2100px;margin:10px auto 0;padding:7px 12px;display:flex;flex-wrap:wrap;
  gap:7px;align-items:center;background:var(--card);border:.5px solid var(--sep);
  border-radius:15px;box-shadow:var(--sh)}
.favbar{margin-left:20px;margin-right:20px}
.favbar .lab{font-size:14px;font-weight:700;color:var(--body);margin-right:4px}
.favempty{font-size:13.5px;color:var(--mute)}
.favchip{min-height:34px;padding:0 12px 0 10px;border-radius:20px;background:var(--fb);
  font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.025em;
  display:inline-flex;align-items:center;gap:8px;transition:transform .1s ease}
.favchip:active{transform:scale(.95)}
.favchip .e{font-size:17px;line-height:1}

/* ══ 보기 전환 + 확대 ══ */
.zoombar{display:flex;gap:8px;align-items:center;margin-left:auto;flex:none}
.vtog{display:flex;background:#E3E6EE;border-radius:11px;padding:2px;gap:2px}
.vb{min-height:36px;padding:0 15px;border-radius:9px;font-size:14.5px;font-weight:700;color:var(--body)}
.vb[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(19,24,38,.14)}
.zctl{display:flex;gap:6px;background:var(--card);border:.5px solid var(--sep2);
  border-radius:12px;padding:3px;box-shadow:var(--sh)}
.zb{min-width:40px;min-height:36px;border-radius:9px;font-size:16px;font-weight:700;color:var(--body)}
.zb.fit{font-size:14px;padding:0 12px}
.zb:active{background:var(--card2)}

/* ══ 관계 안내줄 ══ */
.relinfo{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:90;
  width:min(880px,calc(100vw - 32px));padding:13px 16px;background:rgba(255,255,255,.97);
  backdrop-filter:blur(12px);border:2px solid var(--accent);border-radius:18px;
  box-shadow:var(--sh-lift)}
.ri-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ri-h .nm{font-size:17px;font-weight:700;letter-spacing:-.03em}
.ri-h .sp{flex:1}
.ri-b{min-height:36px;padding:0 13px;border-radius:11px;background:var(--accent-soft);
  color:var(--accent);font-size:14px;font-weight:700}
.ri-x{width:36px;height:36px;border-radius:11px;color:var(--mute);font-size:15px}
.ri-r{font-size:14px;color:var(--body);line-height:1.6}
.ri-r b{font-size:13px;font-weight:700;color:var(--mute);margin-right:8px}

/* ══ 조감도 ══ */
.treewrap{max-width:none;margin:0 auto;padding:6px 20px 18px;overflow-x:auto}
.tree{position:relative;min-width:min-content}
.troot{width:max-content;margin:0 auto;background:var(--card);border:.5px solid var(--sep);
  border-radius:15px;padding:10px 22px;box-shadow:var(--sh);font-size:17.5px;font-weight:700;
  letter-spacing:-.03em}
.tstem{width:2px;height:14px;background:var(--sep2);margin:0 auto;border-radius:2px}
.tbus{position:relative;height:0}
.tbus i{position:absolute;top:0;height:2px;background:var(--sep2);border-radius:2px;display:block}
.tcols{display:flex;gap:14px;align-items:flex-start;width:max-content;margin:0 auto}
.tcol{flex:0 0 auto;width:max-content;max-width:250px;display:flex;flex-direction:column}
.tcolh{border-radius:14px;padding:11px 13px;background:var(--lb);cursor:pointer;
  display:flex;align-items:center;gap:9px;position:relative;margin-top:14px;
  transition:transform .1s ease}
.tcolh:active{transform:scale(.97)}
.tcolh::before{content:"";position:absolute;left:50%;top:-14px;width:2px;height:14px;
  background:var(--sep2);border-radius:2px}
.tcolh .e{font-size:20px;line-height:1}
.tcolh .n{font-size:17px;font-weight:700;color:var(--lt);letter-spacing:-.03em;white-space:nowrap}
.tcolh .c{margin-left:auto;padding-left:10px;font-size:13.5px;font-weight:700;color:var(--lt);
  opacity:.72;background:rgba(255,255,255,.6);padding:2px 9px;border-radius:20px}
.tcolb{display:flex;flex-direction:column;gap:5px;padding:9px 0 0;position:relative}
.tcolb::before{content:"";position:absolute;left:10px;top:0;bottom:10px;width:2px;
  background:var(--sep);border-radius:2px}
.nchip{position:relative;margin-left:22px;background:var(--card);border:1.5px solid var(--sep);
  border-radius:12px;padding:7px 11px;display:flex;align-items:center;gap:8px;
  font-size:15px;font-weight:600;letter-spacing:-.03em;text-align:left;white-space:nowrap;
  box-shadow:0 1px 2px rgba(19,24,38,.05);transition:border-color .15s ease,opacity .15s ease}
.nchip::before{content:"";position:absolute;left:-12px;top:50%;width:12px;height:2px;
  background:var(--sep);border-radius:2px}
.nchip .d{width:8px;height:8px;border-radius:50%;flex:none}
.nchip .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nchip .fv{color:#E8A400;font-size:13px;flex:none}
.nchip .lk{color:var(--accent);font-size:13px;font-weight:700;flex:none}
.nchip:active{transform:scale(.97)}
.nchip.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.nchip.rel-up{border-color:#3B6BF5;background:#F3F6FF}
.nchip.rel-dn{border-color:#C47F00;background:#FFFAF0}
.nchip.dim{opacity:.32}
.tempty{margin-left:22px;font-size:13px;color:var(--sep2)}
.tcolb.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;padding-left:0}
.tcolb.split::before{display:none}
.tcolb.split .nchip{margin-left:0}
.tcolb.split .nchip::before{display:none}
.tcol.wide{max-width:460px}
svg.rel{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:1}
.nchip{z-index:2}

/* 카드의 즐겨찾기 별 */
.card .fav{position:absolute;left:8px;bottom:8px;width:32px;height:32px;border-radius:11px;
  display:grid;place-items:center;font-size:16px;color:var(--sep2)}
.card .fav[data-on="1"]{color:#E8A400}
.card .ft{padding-left:54px}

/* ══ 카드 ══ */
.card{position:relative;background:var(--card);border-radius:var(--r);
  padding:13px 46px 12px 14px;box-shadow:var(--sh);border:.5px solid var(--sep);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  transition:transform .1s ease,box-shadow .15s ease}
.card.tapable{cursor:pointer}
.card.tapable:active{transform:scale(.985)}
.card .hd{display:flex;gap:12px;align-items:flex-start}
.card .ico{flex:none;width:42px;height:42px;border-radius:12px;background:var(--tb);
  display:grid;place-items:center;font-size:22px;line-height:1}
.card .tt{min-width:0;flex:1}
.card .nm{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.025em;line-height:1.3;
  word-break:keep-all;overflow-wrap:break-word}
.card .ds{display:block;font-size:13.5px;color:var(--mute);line-height:1.45;margin-top:4px;
  word-break:keep-all;overflow-wrap:break-word}
.card .tt{display:block}
.card .ft{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:11px;padding-left:54px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;
  padding:4px 10px 4px 8px;border-radius:20px;background:var(--ss);color:var(--sc)}
.mini{font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.mini.stale{color:var(--stop);font-weight:600}
.go{margin-left:auto;font-size:13.5px;font-weight:700;color:var(--accent)}
.nolink{margin-left:auto;font-size:12px;color:var(--mute)}

.card .ed,.card .grip{position:absolute;right:6px;width:34px;height:34px;border-radius:11px;
  display:grid;place-items:center;color:var(--mute);transition:background .15s ease}
.card .ed{top:9px;font-size:17px}
.card .grip{bottom:9px;font-size:16px;letter-spacing:-3px;touch-action:none;cursor:grab;color:#B8C0CE}
.card .ed:active,.card .grip:active{background:var(--card2)}
.card .grip:hover{color:var(--mute)}
.card.dragging{opacity:.3}
.ghost{position:fixed;z-index:300;pointer-events:none;box-shadow:var(--sh-lift);
  transform:rotate(-1.5deg) scale(1.02);opacity:1;background:var(--card)}
.ghost::before{display:none}

.addbtn{min-height:48px;border:2px dashed var(--sep2);border-radius:var(--r);
  color:var(--mute);font-size:14.5px;font-weight:600;background:transparent;
  transition:border-color .15s ease,color .15s ease,background .15s ease}
.addbtn:active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.empty{padding:18px 6px;font-size:13.5px;color:var(--mute);text-align:center}

/* ══ 관계도 ══ */
.flow{max-width:760px;margin:0 auto;padding:22px 20px 80px}
.flow-lead{background:var(--card);border:.5px solid var(--sep);border-radius:var(--r);
  padding:18px 20px;box-shadow:var(--sh);margin-bottom:20px}
.flow-lead h2{font-size:20px;font-weight:700;margin:0 0 7px;letter-spacing:-.03em}
.flow-lead p{margin:0;font-size:15px;color:var(--body);line-height:1.55}
.stage{position:relative;background:var(--card);border:.5px solid var(--sep);border-radius:var(--r);
  padding:16px 46px 16px 60px;box-shadow:var(--sh)}
.stage .no{position:absolute;top:16px;left:16px;width:32px;height:32px;border-radius:50%;
  display:grid;place-items:center;font-family:var(--mono);font-size:14.5px;font-weight:500;
  background:var(--accent-soft);color:var(--accent)}
.stage h3{font-size:17.5px;font-weight:700;margin:0 0 5px;letter-spacing:-.025em;line-height:1.3}
.stage p{margin:0;font-size:14.5px;color:var(--body);line-height:1.55;word-break:keep-all}
.stage .fed{position:absolute;top:12px;right:10px;width:32px;height:32px;border-radius:11px;
  display:grid;place-items:center;color:#B8C0CE;font-size:16px}
.stage .fed:active{background:var(--card2);color:var(--ink)}
.arrow{height:22px;position:relative}
.arrow i{position:absolute;left:31px;top:0;bottom:0;width:2px;background:var(--sep2);border-radius:2px}
.arrow i::after{content:"";position:absolute;left:-4px;bottom:-1px;
  border-left:5px solid transparent;border-right:5px solid transparent;border-top:7px solid var(--sep2)}
.tools-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.tool{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;
  border:.5px solid var(--sep2);background:var(--card2);border-radius:11px;padding:7px 12px}
.tool .dot{width:7px;height:7px}
.tool.link:active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.rule{display:inline-flex;font-size:12.5px;font-family:var(--mono);color:#8A6A15;
  background:#FDF6E3;border:.5px solid #EFE0B4;border-radius:11px;padding:7px 12px;line-height:1.4}
.loop{margin-top:20px;border-radius:var(--r);padding:16px 18px;font-size:14px;color:var(--body);
  background:var(--card2);border:.5px solid var(--sep);line-height:1.6}
.loop b{color:var(--ink)}

/* ══ 시트 (모달) ══ */
.scrim{position:fixed;inset:0;background:rgba(19,24,38,.35);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:16px;
  animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:22px;width:min(440px,100%);max-height:88vh;
  overflow:auto;box-shadow:var(--sh-lift);padding:22px;animation:pop .22s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.modal h2{font-size:20px;font-weight:700;margin:0 0 16px;letter-spacing:-.03em}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin-bottom:6px;
  letter-spacing:.01em}
.fld input,.fld select,.fld textarea{width:100%;min-height:48px;border:none;border-radius:13px;
  padding:12px 14px;font:inherit;font-size:16px;background:#EFF1F6;color:var(--ink)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;background:var(--card);
  box-shadow:0 0 0 3px var(--accent-soft)}
.fld textarea{min-height:76px;resize:vertical;line-height:1.5}
.row2{display:flex;gap:10px}
.row2 .fld{flex:1}
.checks{display:flex;flex-direction:column;gap:2px;max-height:220px;overflow:auto;
  border-radius:13px;padding:8px;background:#EFF1F6}
.checks label{display:flex;gap:11px;align-items:center;font-size:15px;font-weight:500;
  color:var(--ink);min-height:40px;cursor:pointer;padding:0 6px;border-radius:9px}
.checks label:active{background:var(--card)}
.checks input{width:21px;height:21px;min-height:0;flex:none;accent-color:var(--accent)}
.mbtns{display:flex;gap:9px;margin-top:20px}
.mbtns .btn{flex:1;min-height:48px;border-radius:14px}
.btn.danger{color:var(--stop);border-color:#F3CFCB}

.swrow{display:flex;align-items:center;gap:11px;min-height:48px;background:#EFF1F6;
  border-radius:13px;padding:0 14px;font-size:15px;font-weight:500;color:var(--ink);cursor:pointer}
.swrow input{width:21px;height:21px;flex:none;accent-color:var(--accent)}

/* ══ 토스트 ══ */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:400;
  background:rgba(19,24,38,.94);color:#fff;font-size:14.5px;font-weight:500;
  padding:13px 20px;border-radius:16px;box-shadow:var(--sh-lift);max-width:88vw;
  text-align:center;backdrop-filter:blur(10px);animation:pop .22s cubic-bezier(.2,.9,.3,1)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media (max-width:760px){
  :root{--lane:min(84vw,300px)}
  .bar-in{padding:10px 14px 8px;gap:9px}
  .brand h1{font-size:19px}
  .brand .sub{display:none}
  .tools,.hint,.rootrow,.jump{padding-left:14px;padding-right:14px}
  .lanes-scroll{padding-left:14px;padding-right:14px;scroll-snap-type:x mandatory}
  .btn .t{display:none}
  .btn{padding:0 13px}
  .tabs{order:3;width:100%}
  .tab{flex:1;justify-content:center;display:flex;align-items:center}
  .acts{margin-left:auto}
  .flow{padding-left:14px;padding-right:14px}
  .sect{margin-left:14px;margin-right:14px;padding:14px 16px;gap:10px}
  .sect .e{font-size:26px}
  .sect .t{font-size:21px}
  .grid{padding-left:14px;padding-right:14px;grid-template-columns:1fr}
  .favbar,.relinfo{margin-left:14px;margin-right:14px;padding:12px 14px}
  .treewrap{padding-left:14px;padding-right:14px}
  .tcols{gap:9px}
  .tcol{max-width:190px}
  .nchip{font-size:13px;padding:7px 9px;margin-left:17px}
  .nchip::before{left:-9px;width:9px}
  .tcolb::before{left:8px}
  .tcolh{padding:9px 10px;gap:7px}
  .tcolh .n{font-size:14px}
  .modal{border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
  .scrim{align-items:flex-end;padding:0}
  .modal{width:100%;max-height:92vh}
}

<script id="app-code">
(function(){
"use strict";
var FONTS="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap";
var STATUS={
  live:{label:"가동중",color:"#2FA96B",soft:"#E4F6EC"},
  dev :{label:"개발중",color:"#C88512",soft:"#FCF1DC"},
  stop:{label:"중단",  color:"#D94F4F",soft:"#FCE8E8"},
  idea:{label:"구상",  color:"#7C869C",soft:"#EEF1F6"}
};
var ORDER=["live","dev","stop","idea"];
var LSKEY="dalnim_system_map_v1";

var data=JSON.parse(document.getElementById("app-data").textContent);
var api=null, dl=null, dirty=false, view="org", query="", axisView=null;
var collapsed={}, allMode="tree", treeSel=null, zoom=1;
var filter={live:true,dev:true,stop:true,idea:true};

function allOn(){return ORDER.every(function(k){return filter[k];});}
function matches(n){
  if(!query)return true;
  var q=query.trim().toLowerCase();
  if(!q)return true;
  return (String(n.name||"")+" "+String(n.desc||"")+" "+String(n.url||"")).toLowerCase().indexOf(q)>=0;
}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function byId(id){for(var i=0;i<data.nodes.length;i++)if(data.nodes[i].id===id)return data.nodes[i];return null;}
function axisById(id){for(var i=0;i<data.axes.length;i++)if(data.axes[i].id===id)return data.axes[i];return data.axes[0];}
function nodesOf(ax){return data.nodes.filter(function(n){return n.axis===ax;});}
function uid(){var n=1;while(byId("n"+n))n++;return "n"+n;}
function kstToday(){var d=new Date(Date.now()+9*3600*1000);return d.toISOString().slice(0,10);}
function daysSince(s){if(!s)return null;var a=new Date(s+"T00:00:00Z").getTime();if(isNaN(a))return null;
  return Math.floor((new Date(kstToday()+"T00:00:00Z").getTime()-a)/86400000);}
function stamp(){var d=new Date(Date.now()+9*3600*1000);var p=function(x){return(x<10?"0":"")+x;};
  return "v "+d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+"-"+p(d.getUTCHours())+p(d.getUTCMinutes());}

function toast(msg,ms){
  var t=document.querySelector(".toast"); if(t)t.remove();
  t=el("div","toast",esc(msg)); document.body.appendChild(t);
  setTimeout(function(){if(t.parentNode)t.remove();},ms||2600);
}
function markDirty(){dirty=true;var b=document.getElementById("saveBtn");if(b)b.setAttribute("data-dirty","1");}

/* ---------- document builder (never serializes live DOM) ---------- */
function buildDoc(d){
  var css=document.getElementById("app-style").textContent;
  var js=document.getElementById("app-code").textContent;
  var S="<"+"script", E="<"+"/"+"script"+">";
  var json=JSON.stringify(d).replace(/</g,"\\u003c");
  return "<!doctype html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n"+
    "<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n"+
    "<title>"+esc(d.title)+"</title>\n"+
    "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n"+
    "<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n"+
    "<link rel=\"stylesheet\" href=\""+FONTS+"\">\n"+
    "<style id=\"app-style\">"+css+"</style>\n</head>\n<body>\n"+
    S+" id=\"app-data\" type=\"application/json\">"+json+E+"\n"+
    S+" id=\"app-code\">"+js+E+"\n</body>\n</html>\n";
}

/* ---------- save / export ---------- */
function save(){
  var doc=buildDoc(data);
  if(api){
    api.publish(doc).then(function(){ dirty=false; }).catch(function(e){
      var c=(e&&e.code)||"upstream_error";
      if(c==="conflict"){ toast("다른 곳에서 먼저 저장돼 최신본으로 새로고침합니다"); return; }
      if(c==="not_writer"||c==="not_granted"||c==="not_declared"){ localSave(); return; }
      if(c==="rate_limited"){ toast("저장이 너무 잦습니다. 잠시 후 다시 눌러주세요"); return; }
      toast("저장 실패 ("+c+") — 이 브라우저에 임시 저장합니다"); localSave();
    });
    toast("저장 중…",1400);
  }else{ localSave(); }
}
function localSave(){
  try{ localStorage.setItem(LSKEY,JSON.stringify(data)); dirty=false;
       var b=document.getElementById("saveBtn"); if(b)b.setAttribute("data-dirty","0");
       toast("이 브라우저에 저장했습니다 (클라우드 저장은 불가한 화면)");
  }catch(e){ toast("저장할 수 없습니다"); }
}
function exportHtml(){
  var doc=buildDoc(data);
  if(!dl){ toast("이 화면에서는 파일 내보내기를 쓸 수 없습니다"); return; }
  dl.save({filename:"index.html",data:doc}).then(function(){
    toast("index.html 을 내려받았습니다 — GitHub 저장소에 올리면 끝");
  }).catch(function(e){
    var c=(e&&e.code)||"unavailable";
    if(c==="declined")return;
    if(c==="extension_not_enabled"||c==="rejected_extension"){
      dl.save({filename:"index.html.txt",data:doc}).then(function(){
        toast("index.html.txt 로 받았습니다 — 확장자를 .html 로 바꿔서 올리세요");
      }).catch(function(){ toast("내보내기를 완료하지 못했습니다"); });
      return;
    }
    toast("내보내기 실패 ("+c+")");
  });
}

/* ---------- render: org chart ---------- */
function statusChip(st){
  var s=STATUS[st]||STATUS.idea;
  return '<span class="st" style="--sc:'+s.color+';--ss:'+s.soft+'"><span class="dot" style="background:'+s.color+'"></span>'+s.label+'</span>';
}
function cardHtml(n,ax){
  var d=daysSince(n.checked);
  var mini = d===null ? ''
    : '<span class="mini'+(d>90?' stale':'')+'">'+(d===0?"오늘 점검":d+"일 전")+'</span>';
  var link = n.url
    ? '<span class="go">열기 ›</span>'
    : '<span class="nolink">링크 없음</span>';
  return '<div class="hd">'+
      '<span class="ico" style="--tb:'+(ax?ax.bg:"#EFF1F6")+'">'+esc(n.icon||"📦")+'</span>'+
      '<span class="tt">'+
        '<span class="nm">'+esc(n.name)+'</span>'+
        (n.desc?'<span class="ds">'+esc(n.desc)+'</span>':'')+
      '</span>'+
    '</div>'+
    '<div class="ft">'+statusChip(n.status)+mini+link+'</div>'+
    '<button class="ed" data-edit="'+n.id+'" aria-label="'+esc(n.name)+' 고치기">⋯</button>'+
    '<button class="fav" data-fav="'+n.id+'" data-on="'+(n.fav?"1":"0")+'" aria-label="자주 쓰는 것">'+(n.fav?"★":"☆")+'</button>'+
    '<span class="grip" title="끌어서 옮기기" aria-hidden="true">⣿</span>';
}
/* ---------- 조감도 (버드 뷰) ---------- */
function needsOf(n){ return (n.needs||[]).map(byId).filter(Boolean); }
function dependentsOf(id){ return data.nodes.filter(function(x){return (x.needs||[]).indexOf(id)>=0;}); }
function shown(n){ return filter[n.status]&&matches(n); }

function chipHtml(n){
  var s=STATUS[n.status]||STATUS.idea;
  var mark=(needsOf(n).length||dependentsOf(n.id).length)?'<span class="lk">⤷</span>':'';
  return '<span class="d" style="background:'+s.color+'"></span>'+
         '<span class="t">'+esc(n.name)+'</span>'+
         (n.fav?'<span class="fv">★</span>':'')+mark;
}

function renderTree(host){
  var wrap=el("div","wrap");

  /* 즐겨찾기 줄 */
  var favs=data.nodes.filter(function(n){return n.fav&&shown(n);});
  var fb=el("div","favbar");
  fb.innerHTML='<span class="lab">★ 자주 쓰는 것</span>';
  if(!favs.length){
    fb.appendChild(el("span","favempty","카드의 ☆ 를 눌러 여기에 올려두세요"));
  }else{
    favs.forEach(function(n){
      var b=el("button","favchip");
      var ax=axisById(n.axis);
      b.style.setProperty("--fb",ax.bg);
      b.innerHTML='<span class="e">'+esc(n.icon||"📦")+'</span>'+esc(n.name);
      b.onclick=function(){ if(n.url)window.open(n.url,"_blank","noopener"); else openNode(n.id); };
      fb.appendChild(b);
    });
  }
  wrap.appendChild(fb);

  /* 관계 안내줄 — 아래에 떠 있어서 지도 크기를 건드리지 않는다 */
  var info=el("div","relinfo"); info.style.display="none";
  document.body.appendChild(info);

  /* 트리 */
  var tw=el("div","treewrap");
  var tree=el("div","tree");
  var rc=el("div","troot");
  rc.innerHTML='🏠 '+esc(data.root.name);
  tree.appendChild(rc);
  tree.appendChild(el("div","tstem"));
  var bus=el("div","tbus"); bus.innerHTML="<i></i>"; tree.appendChild(bus);

  var cols=el("div","tcols");
  data.axes.forEach(function(ax){
    var list=nodesOf(ax.id).filter(shown);
    var col=el("div","tcol"); col.dataset.axis=ax.id;
    var h=el("div","tcolh");
    h.style.setProperty("--lb",ax.bg); h.style.setProperty("--lt",ax.tx);
    h.innerHTML='<span class="e">'+esc(ax.icon)+'</span><span class="n">'+esc(ax.name)+
                '</span><span class="c">'+list.length+'</span>';
    h.onclick=function(){ axisView=ax.id; renderOrg(); window.scrollTo({top:0,behavior:"smooth"}); };
    col.appendChild(h);
    var body=el("div","tcolb");
    list.forEach(function(n){
      var c=el("button","nchip"); c.dataset.id=n.id;
      if(treeSel===n.id)c.classList.add("sel");
      c.innerHTML=chipHtml(n);
      c.onclick=function(){ treeSel=(treeSel===n.id?null:n.id); renderOrg(); };
      body.appendChild(c);
    });
    if(!list.length) body.appendChild(el("div","tempty","–"));
    col.appendChild(body);
    cols.appendChild(col);
  });
  tree.appendChild(cols);

  var svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","rel"); tree.appendChild(svg);

  tw.appendChild(tree); wrap.appendChild(tw);
  host.appendChild(wrap);

  /* 확대 조절 */
  function applySplit(on){
    cols.querySelectorAll(".tcolb").forEach(function(b){
      var many=b.querySelectorAll(".nchip").length>7;
      b.classList.toggle("split", !!(on&&many));
      b.parentNode.classList.toggle("wide", !!(on&&many));
    });
  }
  function bestFit(){
    applySplit(false); fit(); var z1=zoom;
    applySplit(true);  fit(); var z2=zoom;
    if(z1>=z2-0.001){ applySplit(false); fit(); }
  }
  function apply(z){ zoom=Math.max(.4,Math.min(3,z)); tree.style.zoom=zoom; }
  function fit(){
    /* 남으면 키우고 넘치면 줄인다 — 가로·세로 중 빡빡한 쪽에 맞춰 화면을 꽉 채운다 */
    apply(1);
    for(var i=0;i<7;i++){
      var cw=cols.getBoundingClientRect().width;
      var availW=tw.getBoundingClientRect().width-44;
      var th=tree.getBoundingClientRect().height;
      var availH=window.innerHeight-tree.getBoundingClientRect().top-26;
      if(cw<10||th<10||availW<10||availH<10)break;
      var k=Math.min(availW/cw, availH/th);
      if(k>0.995&&k<1.005)break;
      apply(zoom*k);
    }
    /* 안전장치: 조금이라도 넘치면 넘치지 않을 때까지 살짝 줄인다 */
    for(var g=0;g<8;g++){
      var over=document.documentElement.scrollHeight-window.innerHeight;
      var clip=tw.scrollWidth-tw.clientWidth;
      if(over<=1&&clip<=1)break;
      apply(zoom*0.97);
    }
  }
  var zb=document.querySelector(".zoombar")||el("div","x");
  zb.querySelectorAll(".zb").forEach(function(b){
    b.onclick=function(){
      var k=b.getAttribute("data-z");
      if(k==="fit")bestFit(); else apply(zoom+(k==="+"?.12:-.12));
      drawRel();
    };
  });
  bestFit();
  setTimeout(function(){ if(document.body.contains(tree)){bestFit();drawRel();} },80);
  if(document.fonts&&document.fonts.ready){
    document.fonts.ready.then(function(){ if(document.body.contains(tree)){bestFit();drawRel();} });
  }
  var onres=function(){ if(!document.body.contains(tree)){window.removeEventListener("resize",onres);return;} bestFit(); drawRel(); };
  window.addEventListener("resize",onres);

  /* 루트 → 축 가로선 */
  var hs=cols.querySelectorAll(".tcolh");
  if(hs.length>1){
    var x1=hs[0].offsetLeft+hs[0].offsetWidth/2;
    var x2=hs[hs.length-1].offsetLeft+hs[hs.length-1].offsetWidth/2;
    var line=bus.querySelector("i");
    line.style.left=x1+"px"; line.style.width=(x2-x1)+"px";
  }

  /* 선택한 카드의 물린 관계 그리기 */
  function pos(id){
    var e=tree.querySelector('.nchip[data-id="'+id+'"]');
    if(!e)return null;
    var x=0,y=0,o=e;
    while(o&&o!==tree){ x+=o.offsetLeft; y+=o.offsetTop; o=o.offsetParent; }
    return {x:x,y:y,w:e.offsetWidth,h:e.offsetHeight,el:e};
  }
  function drawRel(){
    svg.innerHTML="";
    tree.querySelectorAll(".nchip").forEach(function(c){c.classList.remove("dim","rel-up","rel-dn");});
    if(!treeSel){ info.style.display="none"; return; }
    var n=byId(treeSel); if(!n){ info.style.display="none"; return; }
    var ups=needsOf(n), dns=dependentsOf(n.id);

    info.style.display="";
    var upTxt = ups.length? ups.map(function(x){return esc(x.name);}).join(" · ") : "없음";
    var dnTxt = dns.length? dns.map(function(x){return esc(x.name);}).join(" · ") : "없음";
    info.innerHTML=
      '<div class="ri-h"><span class="nm">'+esc(n.name)+'</span>'+
        '<span class="sp"></span>'+
        (n.url?'<button class="ri-b go2">열기 ↗</button>':'')+
        '<button class="ri-b">⋯ 고치기</button>'+
        '<button class="ri-x">✕</button></div>'+
      '<div class="ri-r"><b>⬆ 이게 있어야 돎</b> '+upTxt+'</div>'+
      '<div class="ri-r"><b>⬇ 이게 없으면 멈춤</b> '+dnTxt+'</div>';
    var bs=info.querySelectorAll(".ri-b");
    if(n.url){ bs[0].onclick=function(){window.open(n.url,"_blank","noopener");}; bs[1].onclick=function(){openNode(n.id);}; }
    else { bs[0].onclick=function(){openNode(n.id);}; }
    info.querySelector(".ri-x").onclick=function(){ treeSel=null; renderOrg(); };

    if(!ups.length&&!dns.length)return;
    tree.querySelectorAll(".nchip").forEach(function(c){
      var id=c.dataset.id;
      if(id===treeSel)return;
      var isUp=ups.some(function(x){return x.id===id;});
      var isDn=dns.some(function(x){return x.id===id;});
      if(isUp)c.classList.add("rel-up");
      else if(isDn)c.classList.add("rel-dn");
      else c.classList.add("dim");
    });

    svg.setAttribute("width",tree.scrollWidth);
    svg.setAttribute("height",tree.scrollHeight);
    var me=pos(treeSel); if(!me)return;
    function curve(from,to,color){
      var p1={x:from.x+from.w/2,y:from.y+from.h/2}, p2={x:to.x+to.w/2,y:to.y+to.h/2};
      var mx=(p1.x+p2.x)/2, dy=Math.abs(p2.y-p1.y);
      var path=document.createElementNS("http://www.w3.org/2000/svg","path");
      path.setAttribute("d","M"+p1.x+","+p1.y+" C"+mx+","+(p1.y-dy*.25)+" "+mx+","+(p2.y+dy*.25)+" "+p2.x+","+p2.y);
      path.setAttribute("stroke",color); path.setAttribute("stroke-width","2.5");
      path.setAttribute("fill","none"); path.setAttribute("stroke-linecap","round");
      path.setAttribute("opacity",".85");
      svg.appendChild(path);
    }
    ups.forEach(function(x){ var q=pos(x.id); if(q)curve(me,q,"#3B6BF5"); });
    dns.forEach(function(x){ var q=pos(x.id); if(q)curve(me,q,"#C47F00"); });
  }
  drawRel();
}
function axisSection(ax,collapsible){
  var list=nodesOf(ax.id).filter(function(x){return filter[x.status]&&matches(x);});
  var box=el("div","axis");
  var sect=el("div","sect"+(collapsible?" tap":""));
  sect.style.setProperty("--sb",ax.bg); sect.style.setProperty("--st",ax.tx);
  var open=!collapsed[ax.id];
  sect.innerHTML='<span class="e">'+esc(ax.icon)+'</span>'+
    '<span class="t">'+esc(ax.name)+'</span>'+
    '<span class="c">'+list.length+'개</span>'+
    (collapsible?'<span class="cv">'+(open?"⌃":"⌄")+'</span>':'');
  if(collapsible){
    sect.onclick=function(){ collapsed[ax.id]=!collapsed[ax.id]; renderOrg(); };
  }
  box.appendChild(sect);

  var grid=el("div","lane-body grid"); grid.dataset.axis=ax.id;
  if(!open){ grid.style.display="none"; box.appendChild(grid); return box; }

  list.forEach(function(n){
    var c=el("div","card"+(n.url?" tapable":"")); c.dataset.id=n.id;
    c.innerHTML=cardHtml(n,ax);
    attachDrag(c,n);
    grid.appendChild(c);
  });
  var gadd=el("button","addbtn","＋ 프로그램 추가");
  gadd.onclick=function(){openNode(null,ax.id);};
  grid.appendChild(gadd);
  box.appendChild(grid);
  return box;
}
function bindCardBtns(host){
  host.querySelectorAll("[data-edit]").forEach(function(b){
    b.onclick=function(ev){ev.stopPropagation();openNode(b.getAttribute("data-edit"));};
  });
  host.querySelectorAll("[data-fav]").forEach(function(b){
    b.onclick=function(ev){
      ev.stopPropagation();
      var n=byId(b.getAttribute("data-fav")); if(!n)return;
      n.fav=!n.fav; markDirty(); renderOrg();

}

      '</div>'+

/* ---------- drag & drop ---------- */
function attachDrag(cardEl,node){
  cardEl.addEventListener("pointerdown",function(ev){
    if(ev.button!==undefined&&ev.button!==0)return;
    if(ev.target.closest("a,button"))return;
    var onGrip=!!(ev.target.closest&&ev.target.closest(".grip"));
    if(ev.pointerType==="touch"&&!onGrip)return; /* 터치는 손잡이(⠿)로만 — 나머지는 스크롤 */
    var startX=ev.clientX, startY=ev.clientY, started=false, ghost=null, curBody=null;
    var rect=cardEl.getBoundingClientRect(), offX=startX-rect.left, offY=startY-rect.top;
    ev.preventDefault();

    function move(e){
      if(!started){
        if(Math.abs(e.clientX-startX)<7&&Math.abs(e.clientY-startY)<7)return;
        started=true;
        ghost=cardEl.cloneNode(true);
        ghost.className="card ghost";
        ghost.style.setProperty("--sc",getComputedStyle(cardEl).getPropertyValue("--sc"));
        ghost.style.width=rect.width+"px";
        document.body.appendChild(ghost);
        cardEl.classList.add("dragging");
      }
      ghost.style.left=(e.clientX-offX)+"px";
      ghost.style.top=(e.clientY-offY)+"px";
      ghost.style.visibility="hidden";
      var under=document.elementFromPoint(e.clientX,e.clientY);
      ghost.style.visibility="";
      var body=under&&under.closest?under.closest(".lane-body"):null;
      if(!body)return;
      if(curBody&&curBody!==body)curBody.classList.remove("over");
      curBody=body; body.classList.add("over");
      var kids=Array.prototype.filter.call(body.children,function(k){return k!==cardEl&&k.classList.contains("card");});
      var isGrid=body.classList.contains("grid");
      var placed=false;
      for(var i=0;i<kids.length;i++){
        var r=kids[i].getBoundingClientRect();
        var before = isGrid
          ? (e.clientY>=r.top&&e.clientY<=r.bottom ? e.clientX<r.left+r.width/2 : e.clientY<r.top)
          : (e.clientY<r.top+r.height/2);
        if(before){ body.insertBefore(cardEl,kids[i]); placed=true; break; }
      }
      if(!placed){ var addb=body.querySelector(".addbtn"); if(addb)body.insertBefore(cardEl,addb); else body.appendChild(cardEl); }
      var sc=document.querySelector(".lanes-scroll");
      if(sc){ var sr=sc.getBoundingClientRect();
        if(e.clientX>sr.right-46)sc.scrollLeft+=18;
        else if(e.clientX<sr.left+46)sc.scrollLeft-=18; }
    }
    function up(){
      window.removeEventListener("pointermove",move,true);
      window.removeEventListener("pointerup",up,true);
      window.removeEventListener("pointercancel",up,true);
      if(!started){
        // 끌지 않고 그냥 눌렀으면 = 그 프로그램 열기
        if(node.url && !onGrip) window.open(node.url,"_blank","noopener");
        return;
      }
      if(ghost)ghost.remove();
      if(curBody)curBody.classList.remove("over");
      cardEl.classList.remove("dragging");
      var body=cardEl.parentNode;
      var targetAxis=(body&&body.dataset&&body.dataset.axis)||node.axis;
      var nx=cardEl.nextElementSibling;
      while(nx&&!nx.classList.contains("card"))nx=nx.nextElementSibling;
      commitMove(node.id,targetAxis,nx?nx.dataset.id:null);
    }
    window.addEventListener("pointermove",move,true);
    window.addEventListener("pointerup",up,true);
    window.addEventListener("pointercancel",up,true);
  });
}
function commitMove(id,axis,beforeId){
  var n=byId(id); if(!n)return;
  var was=data.nodes.map(function(x){return x.id+":"+x.axis;}).join(",");
  data.nodes=data.nodes.filter(function(x){return x.id!==id;});
  n.axis=axis;
  var lane=data.nodes.filter(function(x){return x.axis===axis;});
  var at=lane.length;
  if(beforeId){ for(var i=0;i<lane.length;i++){ if(lane[i].id===beforeId){ at=i; break; } } }
  lane.splice(at,0,n);
  var rebuilt=[];
  data.axes.forEach(function(a){
    if(a.id===axis){ lane.forEach(function(x){rebuilt.push(x);}); }
    else { data.nodes.forEach(function(x){ if(x.axis===a.id)rebuilt.push(x); }); }
  });
  data.nodes.forEach(function(x){ if(rebuilt.indexOf(x)<0)rebuilt.push(x); });
  data.nodes=rebuilt;
  if(was!==data.nodes.map(function(x){return x.id+":"+x.axis;}).join(","))markDirty();
  renderOrg();
}

    '<br><b>🔔 알림이 붙는 자리</b> — 0번(수집 완료·속보)과 7번(확인일 도래)에 ntfy 폰 푸시와 카톡·텔레그램이 걸립니다.';
  f.appendChild(loop);

  host.querySelectorAll("[data-fedit]").forEach(function(b){

/* ---------- modals ---------- */
function closeModal(){var s=document.querySelector(".scrim");if(s)s.remove();}
function modal(inner){
  closeModal();
  var s=el("div","scrim");
  var m=el("div","modal",inner);
  s.appendChild(m);
  s.addEventListener("pointerdown",function(e){if(e.target===s)closeModal();});
  document.addEventListener("keydown",function k(e){if(e.key==="Escape"){closeModal();document.removeEventListener("keydown",k);}});
  document.body.appendChild(s);
  return m;
}
function openNode(id,defAxis){
  var isNew=!id;
  var n=isNew?{id:uid(),axis:defAxis||data.axes[0].id,icon:"📦",name:"",status:"idea",url:"",desc:"",checked:""}:byId(id);
  if(!n)return;
  var axOpts=data.axes.map(function(a){return '<option value="'+a.id+'"'+(a.id===n.axis?" selected":"")+'>'+esc(a.icon+" "+a.name)+'</option>';}).join("");
  var stOpts=ORDER.map(function(k){return '<option value="'+k+'"'+(k===n.status?" selected":"")+'>'+STATUS[k].label+'</option>';}).join("");
  var cur=n.needs||[];
  var needChecks=data.nodes.filter(function(x){return x.id!==n.id;}).map(function(x){
    var on=cur.indexOf(x.id)>=0;
    return '<label><input type="checkbox" value="'+x.id+'"'+(on?" checked":"")+'>'+esc((x.icon||"")+" "+x.name)+'</label>';
  }).join("");
  var m=modal(
    '<h2>'+(isNew?"프로그램 추가":"프로그램 고치기")+'</h2>'+
    '<div class="row2">'+
      '<div class="fld" style="max-width:96px"><label>아이콘</label><input id="f_icon" value="'+esc(n.icon)+'" maxlength="4"></div>'+
      '<div class="fld"><label>이름</label><input id="f_name" value="'+esc(n.name)+'" placeholder="예: 뉴스레이더"></div>'+
    '</div>'+
    '<div class="fld"><label>링크 (주소)</label><input id="f_url" value="'+esc(n.url)+'" placeholder="https:// 또는 http://localhost:7070"></div>'+
    '<div class="fld"><label>한 줄 설명</label><textarea id="f_desc" placeholder="무엇을 하는 프로그램인지">'+esc(n.desc)+'</textarea></div>'+
    '<div class="row2">'+
      '<div class="fld"><label>소속 축</label><select id="f_axis">'+axOpts+'</select></div>'+
      '<div class="fld"><label>상태</label><select id="f_status">'+stOpts+'</select></div>'+
    '</div>'+
    '<div class="fld"><label>마지막 점검일</label><input id="f_checked" type="date" value="'+esc(n.checked)+'"></div>'+
    '<div class="fld"><label>자주 쓰는 것</label>'+
      '<label class="swrow"><input type="checkbox" id="f_fav"'+(n.fav?" checked":"")+'>'+
      '<span>★ 맨 위 「자주 쓰는 것」 줄에 올리기</span></label></div>'+
    '<div class="fld"><label>이게 있어야 돎 (연결)</label><div class="checks" id="f_needs">'+needChecks+'</div></div>'+
    '<div class="mbtns">'+
      (isNew?'':'<button class="btn danger" id="f_del">삭제</button>')+
      '<button class="btn" id="f_cancel">취소</button>'+
      '<button class="btn primary" id="f_ok">'+(isNew?"추가":"저장")+'</button>'+
    '</div>'
  );
  m.querySelector("#f_cancel").onclick=closeModal;
  var delBtn=m.querySelector("#f_del");
  var armed=false;
  if(delBtn)delBtn.onclick=function(){
    if(!armed){ armed=true; delBtn.textContent="정말 삭제할까요?"; setTimeout(function(){armed=false;delBtn.textContent="삭제";},4000); return; }
    data.nodes=data.nodes.filter(function(x){return x.id!==n.id;});
    data.flow.forEach(function(s){s.tools=(s.tools||[]).filter(function(t){return t!==n.id;});});
    data.nodes.forEach(function(x){ if(x.needs)x.needs=x.needs.filter(function(t){return t!==n.id;}); });
    if(treeSel===n.id)treeSel=null;
    markDirty(); closeModal(); renderOrg();
  };
  m.querySelector("#f_ok").onclick=function(){
    var name=m.querySelector("#f_name").value.trim();
    if(!name){ toast("이름을 넣어주세요"); m.querySelector("#f_name").focus(); return; }
    n.icon=m.querySelector("#f_icon").value.trim()||"📦";
    n.name=name;
    n.url=m.querySelector("#f_url").value.trim();
    n.desc=m.querySelector("#f_desc").value.trim();
    n.status=m.querySelector("#f_status").value;
    n.checked=m.querySelector("#f_checked").value;
    n.fav=m.querySelector("#f_fav").checked;
    n.needs=Array.prototype.slice.call(m.querySelectorAll("#f_needs input:checked")).map(function(c){return c.value;});
    if(!n.needs.length)delete n.needs;
    var newAxis=m.querySelector("#f_axis").value;
    if(isNew){ n.axis=newAxis; data.nodes.push(n); }
    else if(newAxis!==n.axis){ n.axis=newAxis; }
    var rebuilt=[]; data.axes.forEach(function(a){data.nodes.forEach(function(x){if(x.axis===a.id)rebuilt.push(x);});});
    data.nodes=rebuilt;
    markDirty(); closeModal(); renderOrg();
  };
  setTimeout(function(){m.querySelector("#f_name").focus();},40);
}
function openFlow(id){
  var s=null; for(var i=0;i<data.flow.length;i++)if(data.flow[i].id===id)s=data.flow[i];
  if(!s)return;
  var checks=data.nodes.map(function(n){
    var on=(s.tools||[]).indexOf(n.id)>=0;
    return '<label><input type="checkbox" value="'+n.id+'"'+(on?" checked":"")+'>'+esc(n.icon+" "+n.name)+'</label>';
  }).join("");
  var m=modal(
    '<h2>'+esc(s.no)+'단계 고치기</h2>'+
    '<div class="fld"><label>제목</label><input id="s_title" value="'+esc(s.title)+'"></div>'+
    '<div class="fld"><label>설명</label><textarea id="s_desc">'+esc(s.desc)+'</textarea></div>'+
    '<div class="fld"><label>규칙 한 줄</label><input id="s_rule" value="'+esc(s.rule||"")+'"></div>'+
    '<div class="fld"><label>이 단계에서 쓰는 프로그램</label><div class="checks" id="s_tools">'+checks+'</div></div>'+
    '<div class="mbtns"><button class="btn" id="s_cancel">취소</button><button class="btn primary" id="s_ok">저장</button></div>'
  );
  m.querySelector("#s_cancel").onclick=closeModal;
  m.querySelector("#s_ok").onclick=function(){
    s.title=m.querySelector("#s_title").value.trim()||s.title;
    s.desc=m.querySelector("#s_desc").value.trim();
    s.rule=m.querySelector("#s_rule").value.trim();
    s.tools=Array.prototype.slice.call(m.querySelectorAll("#s_tools input:checked")).map(function(c){return c.value;});
    markDirty(); closeModal(); renderFlow();

}

}

function boot(){
  shell(); setView("org");
  if(window.claude&&window.claude.use){
    window.claude.use("artifact").then(function(a){ api=a; }).catch(function(){});
    window.claude.use("downloads").then(function(d){ dl=d; }).catch(function(){});
  }else{
    try{ var raw=localStorage.getItem(LSKEY);
      if(raw){ var saved=JSON.parse(raw); if(saved&&saved.nodes){ data=saved; setView(view); toast("이 브라우저에 저장해둔 내용을 불러왔습니다"); } }
    }catch(e){}
  }
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot); else boot();
})();
