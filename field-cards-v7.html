function updateZoomBadge(){$('zoomBadge').textContent=Math.round(zoom*100)+'%'}function resetZoom(){if(!fab)return;zoom=1;fab.setViewportTransform([1,0,0,1,0,0]);updateZoomBadge();fab.requestRenderAll()}
function addArrow(x1,y1,x2,y2,c,sw){const dx=x2-x1,dy=y2-y1,line=new fabric.Line([0,0,dx,dy],{stroke:c,strokeWidth:sw,originX:'left',originY:'top'}),a=Math.atan2(dy,dx)*180/Math.PI+90,tri=new fabric.Triangle({left:dx,top:dy,originX:'center',originY:'center',width:sw*3+10/zoom,height:sw*3+14/zoom,fill:c,angle:a}),g=new fabric.Group([line,tri],{left:x1,top:y1,name:'mark'});fab.add(g);fab.setActiveObject(g);g.bringToFront()}function addLabel(t,x,y,c){const txt=new fabric.Textbox(t,{left:x,top:y,width:Math.min(300/zoom,fab.width-x-8),fontSize:+$('fontSize').value/zoom,fontWeight:'bold',fill:'#fff',backgroundColor:c,padding:6/zoom,name:'mark'});fab.add(txt);fab.setActiveObject(txt);txt.bringToFront()}
function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));if(!fab)return;fab.isDrawingMode=t==='draw';if(t==='draw'){fab.freeDrawingBrush.color=$('color').value;fab.freeDrawingBrush.width=+$('size').value/zoom}fab.selection=t==='select';fab.forEachObject(o=>{if(o===bgObj)return;o.selectable=t==='select';o.evented=t==='select'});$('opts').classList.toggle('show',['arrow','circle','rect','draw','text','number','blur'].includes(t));const hints={select:'두 손가락 확대/축소 · 표시를 눌러 이동/크기변경',arrow:'시작점에서 끝점까지 드래그',circle:'강조 영역을 드래그',number:'번호 위치를 한 번 누르기',text:'글자 위치를 누르기',draw:'손가락으로 자유롭게 그리기',rect:'영역을 드래그',blur:'가릴 영역을 드래그하면 강한 블러/모자이크가 사진 자체에 적용됩니다.'};$('hint').textContent=hints[t]||'두 손가락으로 확대/축소할 수 있습니다.'}
function overlayJSON(){if(!fab)return null;const j=fab.toDatalessJSON(['name']);j.width=fab.width;j.height=fab.height;return j}function rememberOverlay(){if(!fab)return;overlayHistory.push(JSON.stringify(overlayJSON()));if(overlayHistory.length>20)overlayHistory.shift()}function rememberBase(){baseHistory.push(baseData);if(baseHistory.length>4)baseHistory.shift()}
async function applyPrivacyBlur(box){if(box.width<4||box.height<4)return;resetZoom();const ov=overlayJSON(),img=new Image();img.onload=()=>{rememberBase();const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const ctx=c.getContext('2d');ctx.drawImage(img,0,0);const sx=img.width/fab.width,sy=img.height/fab.height,x=Math.max(0,Math.floor(box.left*sx)),y=Math.max(0,Math.floor(box.top*sy)),w=Math.max(1,Math.min(img.width-x,Math.ceil(box.width*sx))),h=Math.max(1,Math.min(img.height-y,Math.ceil(box.height*sy))),strength=+$('blurStrength').value;const crop=document.createElement('canvas');crop.width=w;crop.height=h;crop.getContext('2d').drawImage(img,x,y,w,h,0,0,w,h);const small=document.createElement('canvas');const div=Math.max(6,strength);small.width=Math.max(2,Math.round(w/div));small.height=Math.max(2,Math.round(h/div));const sc=small.getContext('2d');sc.imageSmoothingEnabled=true;sc.drawImage(crop,0,0,small.width,small.height);ctx.save();ctx.imageSmoothingEnabled=false;ctx.drawImage(small,0,0,small.width,small.height,x,y,w,h);ctx.restore();baseData=c.toDataURL('image/jpeg',.92);initFabric(baseData,ov)};img.src=baseData}
function rotateBase(dir){if(!fab)return;resetZoom();const marks=fab.getObjects().filter(o=>o!==bgObj);if(marks.length&&!confirm('회전하면 현재 표시는 사진에 합쳐지고 개별 선택 편집은 초기화됩니다. 계속할까요?'))return;const flattened=bakeCurrent(),im=new Image();im.onload=()=>{rememberBase();const c=document.createElement('canvas');c.width=im.height;c.height=im.width;const ctx=c.getContext('2d');ctx.translate(c.width/2,c.height/2);ctx.rotate(dir*Math.PI/2);ctx.drawImage(im,-im.width/2,-im.height/2);baseData=c.toDataURL('image/jpeg',.92);overlayHistory=[];initFabric(baseData,null)};im.src=flattened}function bakeCurrent(){const old=zoom;resetZoom();fab.discardActiveObject();bgObj?.sendToBack();fab.renderAll();const out=fab.toDataURL({format:'jpeg',quality:.93,multiplier:1});if(old!==1){zoom=Math.min(5,Math.max(1,old));updateZoomBadge()}return out}function undoAction(){if(overlayHistory.length>1){overlayHistory.pop();const j=JSON.parse(overlayHistory[overlayHistory.length-1]);initFabric(baseData,{objects:(j.objects||[]).filter(o=>o.name!=='background'),width:j.width,height:j.height});return}if(baseHistory.length){baseData=baseHistory.pop();initFabric(baseData,null)}}
function finishEdit(){resetZoom();draftImgs[editIdx].data=bakeCurrent();draftImgs[editIdx].edited=true;const nx=draftImgs.findIndex((x,i)=>i>editIdx&&!x.edited);if(nx>=0){openEditor(nx);return}$('editor').classList.remove('show');renderPhotoRows();$('metaOv').classList.add('show')}function renderPhotoRows(){$('photoRows').innerHTML=draftImgs.map((x,i)=>`<div class="photoRow"><img src="${x.data}"><div><b>사진 ${i+1}</b><div style="margin-top:7px"><select data-role="${i}"><option>일반</option><option ${x.role==='작업 전'?'selected':''}>작업 전</option><option ${x.role==='작업 후'?'selected':''}>작업 후</option></select> <button class="btn ghost" data-edit="${i}">표시 수정</button></div></div></div>`).join('');document.querySelectorAll('[data-role]').forEach(s=>s.onchange=()=>draftImgs[+s.dataset.role].role=s.value);document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{$('metaOv').classList.remove('show');openEditor(+b.dataset.edit)})}
async function upload(data,path){const r=st.ref(`fieldCards/${USER}/${path}`);await r.putString(data,'data_url',{contentType:'image/jpeg'});return await r.getDownloadURL()}async function saveCard(){if(!draftImgs.length)return alert('사진이 없습니다.');const title=$('fTitle').value.trim();if(!title)return alert('제목을 입력하세요.');$('saveCard').disabled=true;$('saveCard').textContent='저장 중…';try{const images=[];for(const x of draftImgs){const id=uid();images.push({id,url:await upload(x.data,id+'.jpg'),role:x.role||'일반'})}const id=uid(),obj={title,date:$('fDate').value,time:$('fTime').value,scope:$('fScope').value,status:$('fStatus').value,location:$('fLocation').value.trim(),category:$('fCategory').value.trim()||'기타',memo:$('fMemo').value.trim(),tags:$('fTags').value.split(',').map(x=>x.trim()).filter(Boolean),images,updated:Date.now(),created:Date.now()};await col.doc(id).set(obj);$('metaOv').classList.remove('show');draftImgs=[];await load();openDetail(id)}catch(e){alert('저장 실패: '+e.message)}finally{$('saveCard').disabled=false;$('saveCard').textContent='💾 카드 저장'}}
function openDetail(id){const r=rows.find(x=>x.id===id);if(!r)return;let i=0;function draw(){const im=r.images?.[i];$('detailBody').innerHTML=`<div class="detailTitle">${esc(r.title||'제목 없음')}</div><div class="meta">${esc(r.location||'위치 미입력')} · ${esc(r.category||'기타')}</div><div class="facts"><div class="fact"><div class="fk">촬영일</div><div class="fv dateLine">${esc(fmtDate(r.date,r.time))}</div></div><div class="fact"><div class="fk">구분</div><div class="fv">${r.scope==='work'?'업무':'개인'}</div></div><div class="fact"><div class="fk">상태</div><div class="fv">${esc(r.status||'발견')}</div></div><div class="fact"><div class="fk">사진</div><div class="fv">${r.images?.length||0}장</div></div></div>${im?`<img id="hero" class="hero" src="${esc(im.url)}"><div class="thumbs">${r.images.map((x,n)=>`<img data-i="${n}" class="${n===i?'on':''}" src="${esc(x.url)}">`).join('')}</div>`:''}<div class="memo"><b>설명 / 메모</b><br>${esc(r.memo||'메모 없음')}</div>`;$('hero')?.addEventListener('click',()=>{$('lbImg').src=$('hero').src;$('lightbox').classList.add('show')});document.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{i=+x.dataset.i;draw()})}draw();$('detail').classList.add('show')}
$('captureBtn').onclick=openCapture;$('sheetCancel').onclick=closeCapture;$('captureSheet').onclick=e=>{if(e.target===$('captureSheet'))closeCapture()};$('cam').onchange=e=>{filesPicked(e.target.files);e.target.value=''};$('gal').onchange=e=>{filesPicked(e.target.files);e.target.value=''};$('q').oninput=render;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));$('moreBtn').onclick=()=>$('morePanel').classList.toggle('show');$('zoomReset').onclick=resetZoom;$('undo').onclick=undoAction;$('del').onclick=()=>{const o=fab?.getActiveObject();if(o&&o!==bgObj){fab.remove(o);fab.discardActiveObject();fab.renderAll();rememberOverlay()}else alert('지울 표시를 먼저 선택하세요.')};$('clear').onclick=()=>{if(!fab)return;fab.getObjects().filter(o=>o!==bgObj).forEach(o=>fab.remove(o));bgObj?.sendToBack();fab.renderAll();rememberOverlay()};$('rotL').onclick=()=>rotateBase(-1);$('rotR').onclick=()=>rotateBase(1);document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{addLabel(b.dataset.q,30,30,$('color').value);rememberOverlay();setTool('select')});$('edSave').onclick=finishEdit;$('edClose').onclick=$('edCancel').onclick=()=>{if(confirm('편집을 취소할까요?')){$('editor').classList.remove('show');draftImgs=[]}};$('addMore').onclick=()=>{$('metaOv').classList.remove('show');openCapture()};$('metaClose').onclick=$('metaCancel').onclick=()=>{if(confirm('카드 작성을 취소할까요?')){$('metaOv').classList.remove('show');draftImgs=[]}};$('saveCard').onclick=saveCard;$('detailClose').onclick=()=>$('detail').classList.remove('show');$('lbClose').onclick=()=>$('lightbox').classList.remove('show');$('lightbox').onclick=e=>{if(e.target===$('lightbox'))$('lightbox').classList.remove('show')};load();
