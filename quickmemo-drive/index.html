'use strict';const TYPES=[['work','업무','▣'],['call','통화','☎'],['daily','데이터','🔒'],['photo','일상','☕'],['study','학습','▤'],['idea','아이디어','✧'],['money','지출/수입','₩'],['etc','기타','•••']];const $=id=>document.getElementById(id);let db,notes=[],active=null,saveTimer=null,filter='all',scope='work',typeFilter='all',dayFilter='',viewMode='date',selectMode=false,selected=new Set(),openedDays=new Set(),pendingWrites=Promise.resolve(),editorSeq=0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateKey=iso=>{const d=new Date(iso);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const dateLabel=k=>new Date(k+'T12:00:00').toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});const money=n=>Number(n||0).toLocaleString('ko-KR')+'원';function uuid(){return crypto.randomUUID?.()||String(Date.now())+'-'+Math.random().toString(36).slice(2)}function initDB(){return new Promise((resolve,reject)=>{let req=indexedDB.open('quickmemo-drive-v1',2);req.onupgradeneeded=()=>{let d=req.result;for(const name of ['notes','images','revisions'])if(!d.objectStoreNames.contains(name))d.createObjectStore(name,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}function tx(store,mode,fn){return new Promise((resolve,reject)=>{const t=db.transaction(store,mode),s=t.objectStore(store);let result;try{result=fn(s)}catch(e){reject(e);return}t.oncomplete=()=>resolve(result?.result);t.onerror=()=>reject(t.error)})}const getAll=s=>tx(s,'readonly',o=>o.getAll());const getOne=(s,id)=>tx(s,'readonly',o=>o.get(id));const put=(s,v)=>tx(s,'readwrite',o=>o.put(v));const del=(s,id)=>tx(s,'readwrite',o=>o.delete(id));function enqueue(work){pendingWrites=pendingWrites.catch(()=>{}).then(work);return pendingWrites}async function load(){notes=(await getAll('notes')).sort((a,b)=>b.created.localeCompare(a.created));render()}function renderTiles(){$('tiles').innerHTML=TYPES.map(([id,name,ico])=>`<button class="tile ${id}" data-type="${id}"><span class="ico">${ico}</span><strong>${name}</strong></button>`).join('');$('type').innerHTML=TYPES.map(([id,name])=>`<option value="${id}">${name}</option>`).join('');document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>openNew(b.dataset.type))}function render(){const q=$('search').value.toLowerCase().trim();let a=notes.filter(n=>{if(filter==='trash')return !!n.deleted; if(n.deleted)return false;if(filter==='pending'&&n.done)return false;if(filter==='done'&&!n.done)return false;if(filter==='star'&&!n.star)return false;return true}).filter(n=>(typeFilter==='all'||n.type===typeFilter)&&(!dayFilter||dateKey(n.created)===dayFilter)).filter(n=>[n.body,n.person,n.category,n.amount].some(v=>String(v??'').toLowerCase().includes(q)));$('count').textContent=a.length+'건';const groups={};a.forEach(n=>(groups[viewMode==='memo'?'memo':dateKey(n.created)]??=[]).push(n));let html='';Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([day,rows],index)=>{let open=viewMode==='memo'||openedDays.has(day)||(!openedDays.size&&index===0);html+=`<section class="day"><button class="daybtn" data-day="${day}"><span>${viewMode==='memo'?'메모별 기록':dateLabel(day)}</span><span>${rows.length}건 ${open?'⌃':'⌄'}</span></button>${open?rows.map(n=>{const t=TYPES.find(t=>t[0]===n.type)?.[1]||'기타';return `<div class="note">${selectMode?`<input class="checkbox" type="checkbox" data-select="${n.id}" ${selected.has(n.id)?'checked':''}>`:''}<div class="notecontent" data-open="${n.id}"><div class="meta"><span class="pill">${t}</span>${viewMode==='memo'?esc(dateLabel(dateKey(n.created)))+' · ':''}${new Date(n.created).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}${n.type==='money'?' · '+esc(n.scope==='work'?'업무':'개인')+' '+esc(n.direction==='income'?'수입':'지출')+' '+money(n.amount):''}${n.done?' · 정리 완료':''}${n.star?' · ★':''}${n.images?.length?' · 📷 '+n.images.length:''}</div><div class="preview">${esc(n.body||n.person||'(사진 메모)')}</div></div><div class="noteactions"><button class="tiny" data-star="${n.id}" title="중요 표시">${n.star?'★':'☆'}</button><button class="tiny" data-open="${n.id}" title="편집">⋯</button></div></div>`}).join(''):''}</section>`});$('days').innerHTML=html||'<div class="empty">메모가 없습니다. 위의 큰 버튼을 눌러 시작하세요.</div>';document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{const d=b.dataset.day;let currently=openedDays.has(d)||(!openedDays.size&&Object.keys(groups)[0]===d);if(!openedDays.size)openedDays=new Set(Object.keys(groups).slice(0,1));currently?openedDays.delete(d):openedDays.add(d);render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openExisting(b.dataset.open));document.querySelectorAll('[data-star]').forEach(b=>b.onclick=async()=>{let n=notes.find(n=>n.id===b.dataset.star);n.star=!n.star;n.updated=new Date().toISOString();await enqueue(()=>put('notes',n));window.dispatchEvent(new CustomEvent('qm-local-save',{detail:{id:n.id}}));render()});document.querySelectorAll('[data-select]').forEach(b=>b.onchange=()=>{b.checked?selected.add(b.dataset.select):selected.delete(b.dataset.select);$('exportSelected').disabled=!selected.size});const now=new Date();let month=notes.filter(n=>!n.deleted&&n.type==='money'&&n.scope===scope&&new Date(n.created).getFullYear()===now.getFullYear()&&new Date(n.created).getMonth()===now.getMonth());$('expenseTotal').textContent=money(month.filter(n=>n.direction==='expense').reduce((s,n)=>s+Number(n.amount||0),0));$('incomeTotal').textContent=money(month.filter(n=>n.direction==='income').reduce((s,n)=>s+Number(n.amount||0),0))}function blank(type){return{id:uuid(),type,body:'',person:'',scope:'work',direction:'expense',amount:'',category:'',created:new Date().toISOString(),updated:new Date().toISOString(),images:[],star:false,done:false,deleted:false}}function editorValues(){if(!active)return;active.type=$('type').value;active.body=$('body').value;active.person=$('person').value;active.scope=$('scope').value;active.direction=$('direction').value;active.amount=$('amount').value;active.category=$('moneyCategory').value;active.updated=new Date().toISOString();return active}function updateCount(){$('charCount').textContent=($('body').value||'').length.toLocaleString('ko-KR')+'자'}function updateFields(){$('personWrap').classList.toggle('hidden',$('type').value!=='call');$('moneyWrap').classList.toggle('hidden',$('type').value!=='money')}function setFocusMode(enabled){const modal=$('modalbg').querySelector('.modal');modal.classList.toggle('focus-mode',enabled);$('longModeBtn').textContent=enabled?'↙ 기본 화면':'⛶ 크게 쓰기';$('longModeBtn').setAttribute('aria-pressed',String(enabled));document.body.classList.toggle('editor-focused',enabled)}function showEditor(n){active=n;editorSeq++;$('modalbg').classList.add('show');setFocusMode(false);$('modalTitle').textContent=n.body||n.images?.length?'메모 수정':'새 메모';$('type').value=n.type;$('body').value=n.body;updateCount();$('person').value=n.person||'';$('scope').value=n.scope||'personal';$('direction').value=n.direction||'expense';$('amount').value=n.amount||'';$('moneyCategory').value=n.category||'';$('saveStatus').textContent='';updateFields();renderEditorActions();renderImages();setTimeout(()=>$('body').focus(),50)}function openNew(type){showEditor(blank(type))}function openExisting(id){const n=notes.find(n=>n.id===id);if(n)showEditor(structuredClone(n))}function renderEditorActions(){$('starBtn').textContent=active.star?'★ 중요':'☆ 중요';$('starBtn').setAttribute('aria-pressed',String(active.star));$('doneBtn').textContent=active.done?'✓ 정리완료':'○ 미정리';$('doneBtn').setAttribute('aria-pressed',String(active.done));$('deleteBtn').textContent=active.deleted?'휴지통에서 복구':'휴지통으로 이동'}function hasContent(n){return !!(n.body.trim()||n.person.trim()||n.images.length||(n.type==='money'&&n.amount!==''))}async function saveNow(){clearTimeout(saveTimer);if(!active)return;const n=structuredClone(editorValues());if(!hasContent(n))return;const seq=editorSeq;$('saveStatus').textContent='저장 중…';try{await enqueue(()=>put('notes',n));let idx=notes.findIndex(x=>x.id===n.id);if(idx<0)notes.unshift(n);else notes[idx]=n;if(seq===editorSeq)$('saveStatus').textContent='';render();window.dispatchEvent(new CustomEvent('qm-local-save',{detail:{id:n.id}}))}catch(e){$('saveStatus').textContent='⚠ 저장 실패: 공간·브라우저 설정 확인';alert('저장에 실패했습니다. 창을 닫지 말고 메모 내용을 복사하세요. '+e.message)}}function scheduleSave(){if(!active)return;editorValues();$('saveStatus').textContent='저장 대기 중…';clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,250)}async function closeEditor(){await saveNow();if($('saveStatus').textContent.startsWith('⚠'))return;active=null;editorSeq++;setFocusMode(false);$('modalbg').classList.remove('show');render()}async function renderImages(){}async function addFiles(files){if(!active)return;for(let f of files){if(!f.type.startsWith('image/'))continue;if(f.size>20*1024*1024){alert('20MB를 넘는 이미지는 첨부할 수 없습니다.');continue}let id=uuid();try{await enqueue(()=>put('images',{id,blob:f,name:f.name,type:f.type}));active.images.push(id);await saveNow()}catch(e){alert('사진 저장 실패: '+e.message)}}await renderImages();window.dispatchEvent(new Event('qm-local-save'))}function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}async function backup(ids){await saveNow();let data=ids?notes.filter(n=>ids.includes(n.id)):notes;let allImages=[];for(let id of new Set(data.flatMap(n=>n.images||[]))){let o=await getOne('images',id);if(!o)continue;let base64=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(o.blob)});allImages.push({id,name:o.name,type:o.type,data:base64})}download(new Blob([JSON.stringify({format:'quickmemo-backup-v1',exported:new Date().toISOString(),notes:data,images:allImages},null,2)],{type:'application/json'}),'순간메모_백업_'+dateKey(new Date().toISOString())+'.json')}async function restore(file){let parsed=JSON.parse(await file.text());if(parsed.format!=='quickmemo-backup-v1'||!Array.isArray(parsed.notes)||!Array.isArray(parsed.images))throw Error('지원하지 않는 백업 파일');if(!confirm(`${parsed.notes.length}건의 기록을 가져올까요? 동일 ID는 백업 내용으로 갱신됩니다.`))return;for(let i of parsed.images){if(!/^[\w-]{1,160}$/.test(i.id))continue;if(!i.data.startsWith('data:image/'))continue;let blob=await(await fetch(i.data)).blob();await enqueue(()=>put('images',{id:i.id,name:i.name,type:i.type,blob}))}for(let n of parsed.notes){if(!(/^[\w-]{1,160}$/.test(n.id))||typeof n.body!=='string'||!Array.isArray(n.images))continue;await enqueue(()=>put('notes',n))}await load();window.dispatchEvent(new Event('qm-local-save'));alert('가져오기를 완료했습니다.')}function exportText(){let a=notes.filter(n=>selected.has(n.id));download(new Blob([a.map(n=>`[${dateLabel(dateKey(n.created))} ${new Date(n.created).toLocaleTimeString('ko-KR')}] ${TYPES.find(t=>t[0]===n.type)?.[1]||'기타'}${n.type==='money'?' / '+(n.scope==='work'?'업무':'개인')+' '+(n.direction==='income'?'수입':'지출')+' '+money(n.amount):''}\n${n.person?'상대: '+n.person+'\n':''}${n.body}\n첨부사진: ${(n.images||[]).length}장\nID: ${n.id}`).join('\n\n---\n\n')],{type:'text/plain;charset=utf-8'}),'순간메모_선택기록.txt')}
async function start(){try{db=await initDB()}catch(e){alert('이 브라우저에서는 저장소를 사용할 수 없습니다. 사생활 보호 모드나 파일 접근 제한을 확인하세요.');return}renderTiles();await load();document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.querySelector('dialog[open]')&&$('modalbg').querySelector('.modal').classList.contains('focus-mode')){e.preventDefault();setFocusMode(false);$('body').focus()}});$('longModeBtn').onclick=()=>{setFocusMode(!$('modalbg').querySelector('.modal').classList.contains('focus-mode'));$('body').focus()};document.querySelectorAll('[data-insert]').forEach(b=>b.onclick=()=>{const el=$('body'),a=el.selectionStart,z=el.selectionEnd,selected=el.value.slice(a,z);const templates={heading:'제목: '+selected,bullet:'-내용: '+selected,quote:'> '+(selected||'인용문'),divider:'\n---\n'};let insertion=templates[b.dataset.insert];el.setRangeText(insertion,a,z,'end');el.dispatchEvent(new Event('input',{bubbles:true}));el.focus()});$('body').addEventListener('input',updateCount);$('type').onchange=()=>{updateFields();scheduleSave()};['body','person','scope','direction','amount','moneyCategory'].forEach(id=>{$(id).addEventListener('input',scheduleSave);$(id).addEventListener('change',scheduleSave)});$('cameraFile').onchange=async e=>{await addFiles([...e.target.files]);e.target.value=''};$('photoFile').onchange=async e=>{await addFiles([...e.target.files]);e.target.value=''};$('closeModal').onclick=closeEditor;$('finishBtn').onclick=closeEditor;$('modalbg').addEventListener('click',e=>{if(e.target===$('modalbg'))closeEditor()});$('starBtn').onclick=()=>{active.star=!active.star;renderEditorActions();scheduleSave()};$('doneBtn').onclick=()=>{active.done=!active.done;renderEditorActions();scheduleSave()};$('deleteBtn').onclick=async()=>{if(!active.deleted&&!confirm('휴지통으로 이동할까요? 기록은 복구할 수 있습니다.'))return;active.deleted=!active.deleted;await saveNow();await closeEditor()};$('addBtn').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});$('search').oninput=render;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;document.querySelectorAll('[data-scope]').forEach(x=>x.classList.toggle('sel',x===b));render()});$('todayBtn').onclick=()=>{dayFilter=dateKey(new Date().toISOString());$('dayFilter').value=dayFilter;openedDays=new Set([dayFilter]);filter='all';$('search').value='';document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x.dataset.filter==='all'));render()};$('selectBtn').onclick=()=>{selectMode=!selectMode;selected.clear();$('selectBtn').textContent=selectMode?'선택 종료':'여러 개 선택';$('exportSelected').disabled=true;render()};$('exportSelected').onclick=exportText;$('backupBtn').onclick=()=>backup();$('jsonBtn').onclick=()=>backup();$('restoreBtn').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async e=>{try{if(e.target.files[0])await restore(e.target.files[0])}catch(err){alert('가져오기 실패: '+err.message)}e.target.value=''};document.addEventListener('visibilitychange',()=>{if(document.hidden&&active)saveNow()});window.addEventListener('beforeunload',e=>{if(active&&saveTimer){e.preventDefault();e.returnValue=''}})}window.QMStart=()=>start().then(()=>window.dispatchEvent(new Event('qm-ready')));
