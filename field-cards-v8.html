function applyPixelBlur(box){if(box.width<5||box.height<5){setTool('blur');return}pushUndo();const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=baseW;c.height=baseH;const ctx=c.getContext('2d');ctx.drawImage(im,0,0,baseW,baseH);const sx=baseW/displayW,sy=baseH/displayH,x=Math.max(0,Math.floor(box.left*sx)),y=Math.max(0,Math.floor(box.top*sy)),w=Math.max(1,Math.min(baseW-x,Math.ceil(box.width*sx))),h=Math.max(1,Math.min(baseH-y,Math.ceil(box.height*sy))),strength=+$('blurStrength').value,div=Math.max(5,strength);const small=document.createElement('canvas');small.width=Math.max(2,Math.floor(w/div));small.height=Math.max(2,Math.floor(h/div));const sctx=small.getContext('2d');sctx.imageSmoothingEnabled=true;sctx.drawImage(im,x,y,w,h,0,0,small.width,small.height);ctx.save();ctx.imageSmoothingEnabled=false;ctx.drawImage(small,0,0,small.width,small.height,x,y,w,h);ctx.restore();baseData=c.toDataURL('image/jpeg',.94);bgObj.setSrc(baseData,()=>{bgObj.set({scaleX:displayW/baseW,scaleY:displayH/baseH});bgObj.sendToBack();fab.renderAll();setTool('blur')})};im.src=baseData}
function bindPinch(){const el=fab.upperCanvasEl;let sd=0,sz=1,sv=null,sm=null;const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY),mid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});el.ontouchstart=e=>{if(e.touches.length===2){e.preventDefault();pinch=true;dragStart=null;if(tempObj){fab.remove(tempObj);tempObj=null}sd=dist(e.touches);sz=zoom;sv=fab.viewportTransform.slice();sm=mid(e.touches);fab.discardActiveObject()}};el.ontouchmove=e=>{if(!pinch||e.touches.length!==2)return;e.preventDefault();const m=mid(e.touches),factor=dist(e.touches)/sd,nz=Math.max(1,Math.min(5,sz*factor)),r=el.getBoundingClientRect(),cx=sm.x-r.left,cy=sm.y-r.top,ratio=nz/sz,v=sv.slice();v[0]=nz;v[3]=nz;v[4]=cx-(cx-v[4])*ratio+(m.x-sm.x);v[5]=cy-(cy-v[5])*ratio+(m.y-sm.y);const minX=displayW-nz*displayW,minY=displayH-nz*displayH;v[4]=Math.min(0,Math.max(minX,v[4]));v[5]=Math.min(0,Math.max(minY,v[5]));fab.setViewportTransform(v);zoom=nz;updateZoom();fab.requestRenderAll()};el.ontouchend=e=>{if(pinch&&e.touches.length<2)pinch=false}}
function updateZoom(){$('zoomBadge').textContent=Math.round(zoom*100)+'%'}function resetZoom(){zoom=1;fab.setViewportTransform([1,0,0,1,0,0]);updateZoom();fab.requestRenderAll()}
function addArrow(x1,y1,x2,y2,c,sw){const dx=x2-x1,dy=y2-y1,line=new fabric.Line([0,0,dx,dy],{stroke:c,strokeWidth:sw}),a=Math.atan2(dy,dx)*180/Math.PI+90,tri=new fabric.Triangle({left:dx,top:dy,originX:'center',originY:'center',width:sw*3+10/zoom,height:sw*3+14/zoom,fill:c,angle:a}),g=new fabric.Group([line,tri],{left:x1,top:y1,name:'mark'});fab.add(g);fab.setActiveObject(g);g.bringToFront()}function addLabel(t,x,y,c){const txt=new fabric.Textbox(t,{left:x,top:y,width:Math.min(300/zoom,fab.width-x-8),fontSize:+$('fontSize').value/zoom,fontWeight:'bold',fill:'#fff',backgroundColor:c,padding:6/zoom,name:'mark'});fab.add(txt);fab.setActiveObject(txt);txt.bringToFront()}
function setTool(t){tool=t;$('morePanel').classList.remove('show');document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));if(!fab)return;fab.isDrawingMode=t==='draw';if(t==='draw'){fab.freeDrawingBrush.color=$('color').value;fab.freeDrawingBrush.width=+$('size').value/zoom}fab.selection=t==='select';fab.forEachObject(o=>{if(o===bgObj)return;o.selectable=t==='select';o.evented=t==='select'});$('opts').classList.toggle('show',['arrow','circle','rect','draw','text','number','blur'].includes(t));$('hint').textContent=t==='blur'?'블러할 부분을 한 번 드래그하세요. 처리 후에도 사진 크기는 그대로 유지됩니다.':'두 손가락 확대/축소 · 확대 상태에서 두 손가락 이동 가능'}
function undoAction(){const s=undoStack.pop();if(!s)return;baseData=s.baseData;const im=new Image();im.onload=()=>{baseW=im.width;baseH=im.height;buildCanvas(s.marks)};im.src=baseData}function bake(){resetZoom();fab.discardActiveObject();bgObj.sendToBack();fab.renderAll();return fab.toDataURL({format:'jpeg',quality:.94,multiplier:1})}function rotatePhoto(dir){pushUndo();const src=bake(),im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.height;c.height=im.width;const ctx=c.getContext('2d');ctx.translate(c.width/2,c.height/2);ctx.rotate(dir*Math.PI/2);ctx.drawImage(im,-im.width/2,-im.height/2);baseData=c.toDataURL('image/jpeg',.94);baseW=c.width;baseH=c.height;const wrap=$('canvasWrap'),mw=Math.max(280,wrap.clientWidth-12),mh=Math.max(260,wrap.clientHeight-12),s=Math.min(mw/baseW,mh/baseH,1);displayW=Math.round(baseW*s);displayH=Math.round(baseH*s);buildCanvas(null)};im.src=src}

async function upload(data,path){const r=st.ref(`fieldCards/${USER}/${path}`);await r.putString(data,'data_url',{contentType:'image/jpeg'});return await r.getDownloadURL()}async function saveCard(){if(!draftImgs.length)return alert('사진이 없습니다.');const title=$('fTitle').value.trim();if(!title)return alert('제목을 입력하세요.');$('saveCard').disabled=true;try{const images=[];for(const x of draftImgs){const id=uid();images.push({id,url:await upload(x.data,id+'.jpg'),role:x.role||'일반'})}const id=uid(),obj={title,date:$('fDate').value,time:$('fTime').value,scope:$('fScope').value,status:$('fStatus').value,location:$('fLocation').value.trim(),category:$('fCategory').value.trim()||'기타',memo:$('fMemo').value.trim(),tags:$('fTags').value.split(',').map(x=>x.trim()).filter(Boolean),images,updated:Date.now(),created:Date.now()};await col.doc(id).set(obj);$('metaOv').classList.remove('show');draftImgs=[];await load();openDetail(id)}catch(e){alert('저장 실패: '+e.message)}finally{$('saveCard').disabled=false}}
