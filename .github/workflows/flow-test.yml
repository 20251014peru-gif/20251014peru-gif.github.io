# 자막 확보 실험 — 수동 실행 전용 (일정 없음). 확인 끝나면 이 파일은 지워도 됩니다.
name: Flow 자막 테스트

on:
  workflow_dispatch: {}

jobs:
  captiontest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 자막 라이브러리 설치
        run: pip install youtube-transcript-api

      - name: 자막 가져오기 시험
        run: python flow_caption_test.py
