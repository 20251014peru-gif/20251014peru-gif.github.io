# 흐름지도(flow) 수집기 — v 20260902-0530
# 뉴스레이더(news.yml)와 같은 구조. requirements.txt 대신 requirements-flow.txt 를 써서
# 뉴스 워크플로우에 영향을 주지 않습니다.
name: Flow Collector

on:
  schedule:
    - cron: '0 22 * * *'        # 22:00 UTC = 07:00 KST — 아침 브리핑
    - cron: '0 1,4,7,10,13,16,19 * * *'   # 3시간 간격 — 긴급 감지(무료, AI 호출 없음)
  workflow_dispatch: {}          # GitHub 에서 'Run workflow' 버튼으로 수동 실행

permissions:
  contents: write                # flow.json 커밋 권한

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements-flow.txt

      - name: 실행 모드 결정
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "0 22 * * *" ]; then
            echo "mode=brief" >> $GITHUB_OUTPUT
          elif [ -z "${{ github.event.schedule }}" ]; then
            echo "mode=brief" >> $GITHUB_OUTPUT
          else
            echo "mode=watch" >> $GITHUB_OUTPUT
          fi

      - name: 수집 실행
        env:
          # AI 는 호출하지 않습니다 — 자동 수집은 무료 (뉴스레이더와 같은 원칙)
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_MODE:   ${{ steps.mode.outputs.mode }}
        run: python flow_collector.py

      - name: 변경분 커밋
        run: |
          git config user.name "flow-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A flow.json flow_topics.json flow_history.json flow_state.json 2>/dev/null || true
          git commit -m "auto: flow update $(date -u +%Y-%m-%dT%H:%MZ)" || echo "변경 없음"
          git push || echo "push 스킵"

      - name: 실패하면 폰으로 알림
        if: failure()
        run: |
          curl -s -d "흐름지도 수집 실패
          로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            https://ntfy.sh/${{ secrets.NTFY_TOPIC }} || true
