name: News Radar Collector
on:
  schedule:
    - cron: '5 * * * *'      # 매시 5분마다 (UTC). 1시간 간격 자동 수집
  workflow_dispatch: {}       # GitHub에서 'Run workflow' 버튼으로 수동 실행
permissions:
  contents: write             # news.json 커밋 권한
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 수집 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
        run: python collector.py
      - name: 변경분 커밋
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json glossary.json archive/ || true
          git commit -m "auto: news update $(date -u +%Y-%m-%dT%H:%MZ)" || echo "변경 없음"
          git push || echo "push 스킵"
