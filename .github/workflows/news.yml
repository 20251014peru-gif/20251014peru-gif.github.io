# v 20260904-1247  |  수정: archive 30일 지난 파일 자동 삭제 스텝 추가 (이전 v 20260830-1830: cron 3회 분산·push 재시도·concurrency)
#                        push 재시도 3회 + 끝내 실패하면 조용히 넘어가지 않고 알림,
#                        concurrency 로 수집끼리 겹치지 않게
name: News Radar Collector

on:
  schedule:
    # 깃허브 예약 실행은 '되도록 해준다' 수준이라 바쁠 때 그냥 건너뛴다.
    # 실제로 08-30 에 매시 1회 설정인데도 00:31 / 04:16 / 07:28 / 10:08 네 번만 돌았다.
    # 그래서 시간당 3번 두드린다. 하나만 걸려도 그 시간대 수집은 된다.
    # 정각(:00,:05)은 전 세계가 몰려 가장 잘 밀리므로 어중간한 분으로 잡았다.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:           # Actions 탭에서 수동 실행 / 사이트 '지금수집' 버튼

permissions:
  contents: write              # news.json 등 커밋 권한

concurrency:
  group: news-collect          # 수집끼리 겹쳐서 push 가 충돌하지 않게
  cancel-in-progress: false    # 돌고 있는 건 끝까지 두고, 새 건 기다린다

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 수집 실행
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python collector.py

      - name: archive 30일 지난 파일 정리
        run: |
          # 원칙: 저장소가 하루 2~7MB 씩 커지는 걸 막는다. 파일 이름(YYYY-MM-DD)이 30일보다 오래되면 삭제.
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%d)
          n=0
          for f in archive/*.json; do
            [ -e "$f" ] || continue
            d=$(basename "$f" .json)
            if [[ "$d" < "$cutoff" ]]; then git rm -q "$f" && n=$((n+1)); fi
          done
          echo "::notice::archive 30일 정리: ${n}개 삭제 (기준일 $cutoff 이전)"

      - name: 변경분 커밋
        run: |
          set -o pipefail
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json glossary.json trends.json stocks.json archive/ lite/ bodies/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "::notice::새로 들어온 뉴스가 없어 커밋할 것이 없습니다."
            exit 0
          fi

          git commit -m "auto: news update $(date -u +%Y-%m-%dT%H:%MZ)"

          # 달님이 웹에서 파일을 올리는 중이면 push 가 밀린다 → 최대 3번 다시 시도
          pushed=0
          for i in 1 2 3; do
            git pull --rebase --autostash || true
            if git push; then
              echo "::notice::push 성공 (시도 $i 회)"
              pushed=1
              break
            fi
            echo "push 실패 — $((i*5))초 뒤 다시 시도"
            sleep $((i*5))
          done

          # 예전에는 push 가 실패해도 조용히 넘어가 뉴스가 안 올라오는 걸 몰랐다.
          if [ "$pushed" != "1" ]; then
            echo "::error::세 번 시도했지만 push 하지 못했습니다."
            exit 1
          fi

      - name: 실패하면 폰으로 알림
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s -H "Title: 뉴스레이더 수집 실패" -H "Priority: 4" -H "Tags: warning" \
               -d "로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
               "https://ntfy.sh/${NTFY_TOPIC}"
