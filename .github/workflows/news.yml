name: News Radar Collector

on:
  schedule:
    - cron: '5 * * * *'        # 매시 5분 (UTC) — 1시간 간격 자동 수집
  workflow_dispatch:           # Actions 탭에서 수동 실행 / 사이트 '지금수집' 버튼

permissions:
  contents: write              # news.json 등 커밋 권한

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 수집 실행
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python collector.py

      - name: 변경분 커밋
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json glossary.json || true
          git add trends.json || true
          git add stocks.json || true
          git add archive/ || true
          git commit -m "auto: news update $(date -u +%Y-%m-%dT%H:%MZ)" || echo "변경 없음"
          git pull --rebase --autostash || true
          git push || echo "push 스킵"

      - name: 실패하면 폰으로 알림
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s -H "Title: 뉴스레이더 수집 실패" -H "Priority: 4" -H "Tags: warning" \
               -d "로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
               "https://ntfy.sh/${NTFY_TOPIC}"
