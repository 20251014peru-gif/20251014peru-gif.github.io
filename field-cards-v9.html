function bounds(a){if(a.type==='number')return{x:a.x-24,y:a.y-24,w:48,h:48};if(a.type==='text')return{x:a.x-5,y:a.y-5,w:Math.max(80,a.text.length*a.font*.7),h:a.font*1.5};if(a.type==='draw'){const xs=a.pts.map(p=>p.x),ys=a.pts.map(p=>p.y);return{x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)}}const x1=Math.min(a.x1??a.x,a.x2??a.x+a.w),y1=Math.min(a.y1??a.y,a.y2??a.y+a.h),x2=Math.max(a.x1??a.x,a.x2??a.x+a.w),y2=Math.max(a.y1??a.y,a.y2??a.y+a.h);return{x:x1,y:y1,w:x2-x1,h:y2-y1}}
function hitTest(p){for(let i=anns.length-1;i>=0;i--){if(anns[i].type==='blur')continue;const b=bounds(anns[i]),m=20/view.zoom;if(p.x>=b.x-m&&p.x<=b.x+b.w+m&&p.y>=b.y-m&&p.y<=b.y+b.h+m)return i}return-1}function snapshot(){undoStack.push(JSON.stringify(anns));if(undoStack.length>30)undoStack.shift()}
function setTool(t){tool=t;selected=-1;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));$('opts').classList.toggle('show',['arrow','circle','rect','draw','text','number','blur'].includes(t));$('morePanel').classList.remove('show');const h={select:'한 손가락 사진 이동 · 두 손가락 확대/축소 · 표시를 누르면 선택',arrow:'시작점→끝점 드래그',circle:'강조 영역 드래그',number:'번호 위치 탭',text:'글자 위치 탭',draw:'손가락으로 그리기',rect:'영역 드래그',blur:'가릴 영역 드래그 · 저장 이미지에 그대로 적용'};$('hint').textContent=h[t]||'';renderEditor()}

function beginOne(e){const sp=evPos(e),ip=screenToImage(sp.x,sp.y);if(tool==='select'){const h=hitTest(ip);if(h>=0){selected=h;gesture={kind:'moveAnn',start:ip,orig:JSON.parse(JSON.stringify(anns[h]))}}else gesture={kind:'pan',start:sp,panX:view.panX,panY:view.panY};renderEditor();return}if(tool==='number'){snapshot();anns.push({type:'number',x:ip.x,y:ip.y,n:numSeq++});setTool('select');return}if(tool==='text'){const text=prompt('글자를 입력하세요');if(text){snapshot();anns.push({type:'text',x:ip.x,y:ip.y,text,color:$('color').value,font:+$('fontSize').value})}setTool('select');return}if(tool==='draw'){snapshot();preview={type:'draw',pts:[ip],color:$('color').value,size:+$('size').value};gesture={kind:'draw'};return}if(['arrow','circle','rect','blur'].includes(tool)){drawStart=ip;preview=tool==='blur'?{type:'blur',x:ip.x,y:ip.y,w:1,h:1,strength:+$('blurStrength').value}:{type:tool,x1:ip.x,y1:ip.y,x2:ip.x,y2:ip.y,color:$('color').value,size:+$('size').value};gesture={kind:'shape'};renderEditor()}}
function moveOne(e){if(!gesture)return;const sp=evPos(e),ip=screenToImage(sp.x,sp.y);if(gesture.kind==='pan'){view.panX=gesture.panX+(sp.x-gesture.start.x);view.panY=gesture.panY+(sp.y-gesture.start.y)}else if(gesture.kind==='moveAnn'){const dx=ip.x-gesture.start.x,dy=ip.y-gesture.start.y,a=JSON.parse(JSON.stringify(gesture.orig));if('x'in a)a.x+=dx;if('y'in a)a.y+=dy;if('x1'in a){a.x1+=dx;a.x2+=dx;a.y1+=dy;a.y2+=dy}if(a.pts)a.pts=a.pts.map(p=>({x:p.x+dx,y:p.y+dy}));anns[selected]=a}else if(gesture.kind==='draw'){preview.pts.push(ip)}else if(gesture.kind==='shape'){if(tool==='blur'){preview.x=Math.min(drawStart.x,ip.x);preview.y=Math.min(drawStart.y,ip.y);preview.w=Math.abs(ip.x-drawStart.x);preview.h=Math.abs(ip.y-drawStart.y)}else{preview.x2=ip.x;preview.y2=ip.y}}renderEditor()}

function renderToFull(){const out=document.createElement('canvas');out.width=sourceImg.width;out.height=sourceImg.height;const c=out.getContext('2d');c.drawImage(sourceImg,0,0);for(const a of anns){if(a.type==='blur'){const div=Math.max(5,a.strength||14),sw=Math.max(2,Math.round(a.w/div)),sh=Math.max(2,Math.round(a.h/div)),tmp=document.createElement('canvas');tmp.width=sw;tmp.height=sh;tmp.getContext('2d').drawImage(sourceImg,a.x,a.y,a.w,a.h,0,0,sw,sh);c.save();c.imageSmoothingEnabled=false;c.drawImage(tmp,0,0,sw,sh,a.x,a.y,a.w,a.h);c.restore();continue}c.save();c.strokeStyle=a.color||'#ff2525';c.fillStyle=a.color||'#ff2525';c.lineWidth=a.size||6;c.lineCap='round';c.lineJoin='round';if(a.type==='arrow'){c.beginPath();c.moveTo(a.x1,a.y1);c.lineTo(a.x2,a.y2);c.stroke();const ang=Math.atan2(a.y2-a.y1,a.x2-a.x1),L=18;c.beginPath();c.moveTo(a.x2,a.y2);c.lineTo(a.x2-L*Math.cos(ang-.5),a.y2-L*Math.sin(ang-.5));c.lineTo(a.x2-L*Math.cos(ang+.5),a.y2-L*Math.sin(ang+.5));c.closePath();c.fill()}else if(a.type==='circle'){c.beginPath();c.ellipse((a.x1+a.x2)/2,(a.y1+a.y2)/2,Math.abs(a.x2-a.x1)/2,Math.abs(a.y2-a.y1)/2,0,0,Math.PI*2);c.stroke()}else if(a.type==='rect')c.strokeRect(Math.min(a.x1,a.x2),Math.min(a.y1,a.y2),Math.abs(a.x2-a.x1),Math.abs(a.y2-a.y1));else if(a.type==='number'){c.fillStyle='#ffd400';c.strokeStyle='#111';c.lineWidth=2;c.beginPath();c.arc(a.x,a.y,20,0,Math.PI*2);c.fill();c.stroke();c.fillStyle='#111';c.font='bold 22px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(String(a.n),a.x,a.y)}else if(a.type==='text'){c.font=`bold ${a.font}px sans-serif`;c.textBaseline='top';const m=c.measureText(a.text),h=a.font*1.25;c.fillStyle=a.color;c.fillRect(a.x-6,a.y-6,m.width+12,h+12);c.fillStyle='#fff';c.fillText(a.text,a.x,a.y)}else if(a.type==='draw'){c.beginPath();a.pts.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.stroke()}c.restore()}return out.toDataURL('image/jpeg',.93)}

async function upload(data,path){if(!st)throw new Error('클라우드 연결이 없습니다.');const r=st.ref(`fieldCards/${USER}/${path}`);await r.putString(data,'data_url',{contentType:'image/jpeg'});return r.getDownloadURL()}async function saveCard(){if(!draftImgs.length)return alert('사진이 없습니다.');const title=$('fTitle').value.trim();if(!title)return alert('제목을 입력하세요.');$('saveCard').disabled=true;$('saveCard').textContent='저장 중…';try{const images=[];for(const x of draftImgs){const id=uid();images.push({id,url:await upload(x.data,id+'.jpg'),role:x.role||'일반'})}const id=uid(),obj={title,date:$('fDate').value,time:$('fTime').value,scope:$('fScope').value,status:$('fStatus').value,location:$('fLocation').value.trim(),category:$('fCategory').value.trim()||'기타',memo:$('fMemo').value.trim(),tags:$('fTags').value.split(',').map(x=>x.trim()).filter(Boolean),images,updated:Date.now(),created:Date.now()};await col.doc(id).set(obj);$('metaOv').classList.remove('show');draftImgs=[];await load();openDetail(id)}catch(e){alert('저장 실패: '+e.message)}finally{$('saveCard').disabled=false;$('saveCard').textContent='💾 카드 저장'}}
