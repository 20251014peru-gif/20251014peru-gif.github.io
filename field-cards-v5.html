const FB={apiKey:'AIzaSyAyG1chECYsbO7cSZUuXmNa0_KDYBmahPY',authDomain:'my-system-25497.firebaseapp.com',projectId:'my-system-25497',storageBucket:'my-system-25497.firebasestorage.app'},USER='달님';const $=id=>document.getElementById(id);firebase.initializeApp(FB);const db=firebase.firestore(),st=firebase.storage(),col=db.collection('scanapp').doc(USER).collection('fieldCards');let rows=[],scope='all',draftImgs=[],editIdx=0,fab=null,bgObj=null,tool='select',dragStart=null,tempObj=null,hist=[],numSeq=1;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#039;'}[m]));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);function nowParts(){const d=new Date(),z=n=>String(n).padStart(2,'0');return{date:`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`,time:`${z(d.getHours())}:${z(d.getMinutes())}`}}

function openCapture(){$('captureSheet').classList.add('show')}function closeCapture(){$('captureSheet').classList.remove('show')}function readResize(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onload=()=>{const max=1800,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.9))};im.src=fr.result};fr.readAsDataURL(file)})}async function filesPicked(fs){if(!fs?.length)return;closeCapture();if(!draftImgs.length){const n=nowParts();$('fDate').value=n.date;$('fTime').value=n.time;$('fScope').value='work';$('fStatus').value='발견';$('fTitle').value='';$('fLocation').value='';$('fCategory').value='';$('fMemo').value='';$('fTags').value=''}for(const f of fs)draftImgs.push({data:await readResize(f),role:'일반',edited:false});editIdx=draftImgs.findIndex(x=>!x.edited);openEditor(editIdx)}
function openEditor(i){editIdx=i;numSeq=1;hist=[];$('editor').classList.add('show');$('edTitle').textContent=`사진 편집 ${i+1}/${draftImgs.length}`;requestAnimationFrame(()=>initFabric(draftImgs[i].data))}function initFabric(data){if(fab)try{fab.dispose()}catch(e){}const wrap=$('canvasWrap'),mw=Math.max(300,wrap.clientWidth-16),mh=Math.max(300,wrap.clientHeight-16),im=new Image();im.onload=()=>{const s=Math.min(mw/im.width,mh/im.height,1),w=Math.max(280,Math.round(im.width*s)),h=Math.max(240,Math.round(im.height*s));fab=new fabric.Canvas('editCanvas',{width:w,height:h,backgroundColor:'#111',preserveObjectStacking:true});fabric.Image.fromURL(data,bg=>{bgObj=bg;bg.set({left:0,top:0,scaleX:w/bg.width,scaleY:h/bg.height,selectable:false,evented:false,name:'background'});fab.add(bg);bg.sendToBack();bindFab();setTool('select');snapshot()})};im.src=data}
function bindFab(){fab.off();fab.on('object:added',e=>{if(e.target!==bgObj&&bgObj)bgObj.sendToBack()});fab.on('mouse:down',o=>{const p=fab.getPointer(o.e),c=$('color').value,sw=+$('size').value;if(tool==='select')return;if(tool==='text'){const t=prompt('글자를 입력하세요');if(t)addLabel(t,p.x,p.y,c);setTool('select');snapshot();return}if(tool==='number'){const cc=new fabric.Circle({radius:19,fill:'#ffd400',stroke:'#111',strokeWidth:2}),tt=new fabric.Text(String(numSeq++),{fontSize:22,fontWeight:'bold',fill:'#111',originX:'center',originY:'center',left:19,top:19}),g=new fabric.Group([cc,tt],{left:p.x-19,top:p.y-19});fab.add(g);fab.setActiveObject(g);g.bringToFront();snapshot();return}if(['arrow','circle','rect','blur'].includes(tool)){dragStart=p;if(tool==='circle')tempObj=new fabric.Ellipse({left:p.x,top:p.y,rx:1,ry:1,fill:'transparent',stroke:c,strokeWidth:sw,selectable:false,evented:false});if(tool==='rect')tempObj=new fabric.Rect({left:p.x,top:p.y,width:1,height:1,fill:'transparent',stroke:c,strokeWidth:sw,selectable:false,evented:false});if(tool==='blur')tempObj=new fabric.Rect({left:p.x,top:p.y,width:1,height:1,fill:'rgba(255,255,255,.18)',stroke:'#fff',strokeDashArray:[6,5],selectable:false,evented:false});if(tempObj)fab.add(tempObj)}});fab.on('mouse:move',o=>{if(!dragStart||!tempObj)return;const p=fab.getPointer(o.e),l=Math.min(dragStart.x,p.x),t=Math.min(dragStart.y,p.y),w=Math.abs(p.x-dragStart.x),h=Math.abs(p.y-dragStart.y);if(tool==='circle')tempObj.set({left:l,top:t,rx:w/2,ry:h/2});else tempObj.set({left:l,top:t,width:w,height:h});fab.renderAll()});fab.on('mouse:up',o=>{if(!dragStart)return;const p=fab.getPointer(o.e),c=$('color').value,sw=+$('size').value;if(tool==='arrow')addArrow(dragStart.x,dragStart.y,p.x,p.y,c,sw);if(tool==='blur'&&tempObj){const l=tempObj.left,t=tempObj.top,w=tempObj.width,h=tempObj.height;fab.remove(tempObj);tempObj=null;applyBlur(l,t,w,h)}else if(tempObj){tempObj.set({selectable:true,evented:true});fab.setActiveObject(tempObj);tempObj.bringToFront()}dragStart=null;tempObj=null;snapshot();setTool('select')});fab.on('path:created',e=>{e.path.bringToFront();snapshot()})}
function addArrow(x1,y1,x2,y2,c,sw){const line=new fabric.Line([0,0,x2-x1,y2-y1],{stroke:c,strokeWidth:sw}),a=Math.atan2(y2-y1,x2-x1)*180/Math.PI+90,tri=new fabric.Triangle({left:x2-x1,top:y2-y1,originX:'center',originY:'center',width:sw*3+10,height:sw*3+14,fill:c,angle:a}),g=new fabric.Group([line,tri],{left:x1,top:y1});fab.add(g);fab.setActiveObject(g);g.bringToFront()}function addLabel(t,x,y,c){const txt=new fabric.Textbox(t,{left:x,top:y,width:Math.min(300,fab.width-x-8),fontSize:+$('fontSize').value,fontWeight:'bold',fill:'#fff',backgroundColor:c,padding:6});fab.add(txt);fab.setActiveObject(txt);txt.bringToFront()}
function applyBlur(l,t,w,h){if(w<8||h<8)return;const composite=fab.toDataURL({format:'png',multiplier:1});fabric.Image.fromURL(composite,img=>{img.set({left:0,top:0,selectable:true,evented:true});img.filters=[new fabric.Image.filters.Blur({blur:.55})];img.applyFilters();img.clipPath=new fabric.Rect({left:l,top:t,width:w,height:h,absolutePositioned:true});fab.add(img);img.bringToFront();fab.setActiveObject(img);fab.renderAll();snapshot()})}

function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));if(!fab)return;fab.isDrawingMode=t==='draw';if(t==='draw'){fab.freeDrawingBrush.color=$('color').value;fab.freeDrawingBrush.width=+$('size').value}fab.selection=t==='select';fab.forEachObject(o=>{if(o===bgObj)return;o.selectable=t==='select';o.evented=t==='select'});$('opts').classList.toggle('show',['arrow','circle','rect','draw','text','number'].includes(t))}function snapshot(){if(!fab)return;hist.push(JSON.stringify(fab.toJSON(['name'])));if(hist.length>30)hist.shift()}function restore(json){fab.loadFromJSON(json,()=>{bgObj=fab.getObjects().find(o=>o.name==='background')||fab.getObjects()[0];if(bgObj){bgObj.set({selectable:false,evented:false});bgObj.sendToBack()}bindFab();setTool('select');fab.renderAll()})}function bake(){fab.discardActiveObject();bgObj?.sendToBack();fab.renderAll();return fab.toDataURL({format:'jpeg',quality:.93,multiplier:2})}
function finishEdit(){draftImgs[editIdx].data=bake();draftImgs[editIdx].edited=true;const nx=draftImgs.findIndex((x,i)=>i>editIdx&&!x.edited);if(nx>=0){openEditor(nx);return}$('editor').classList.remove('show');renderPhotoRows();$('metaOv').classList.add('show')}function renderPhotoRows(){$('photoRows').innerHTML=draftImgs.map((x,i)=>`<div class="photoRow"><img src="${x.data}"><div><b>사진 ${i+1}</b><div style="margin-top:7px"><select data-role="${i}"><option>일반</option><option ${x.role==='작업 전'?'selected':''}>작업 전</option><option ${x.role==='작업 후'?'selected':''}>작업 후</option></select> <button class="btn ghost" data-edit="${i}">표시 수정</button></div></div></div>`).join('');document.querySelectorAll('[data-role]').forEach(s=>s.onchange=()=>draftImgs[+s.dataset.role].role=s.value);document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{$('metaOv').classList.remove('show');openEditor(+b.dataset.edit)})}
async function upload(data,path){const r=st.ref(`fieldCards/${USER}/${path}`);await r.putString(data,'data_url',{contentType:'image/jpeg'});return await r.getDownloadURL()}async function saveCard(){if(!draftImgs.length)return alert('사진이 없습니다.');const title=$('fTitle').value.trim();if(!title)return alert('제목을 입력하세요.');$('saveCard').disabled=true;try{const images=[];for(const x of draftImgs){const id=uid();images.push({id,url:await upload(x.data,id+'.jpg'),role:x.role||'일반'})}const id=uid(),obj={title,date:$('fDate').value,time:$('fTime').value,scope:$('fScope').value,status:$('fStatus').value,location:$('fLocation').value.trim(),category:$('fCategory').value.trim()||'기타',memo:$('fMemo').value.trim(),tags:$('fTags').value.split(',').map(x=>x.trim()).filter(Boolean),images,updated:Date.now(),created:Date.now()};await col.doc(id).set(obj);$('metaOv').classList.remove('show');draftImgs=[];await load();openDetail(id)}catch(e){alert('저장 실패: '+e.message)}finally{$('saveCard').disabled=false}}
function openDetail(id){const r=rows.find(x=>x.id===id);if(!r)return;let i=0;function draw(){const im=r.images?.[i];$('detailBody').innerHTML=`<div class="detailTitle">${esc(r.title||'제목 없음')}</div><div class="meta">${esc(r.location||'위치 미입력')} · ${esc(r.category||'기타')}</div><div class="facts"><div class="fact"><div class="fk">촬영일</div><div class="fv">${esc(r.date||'')} ${esc(r.time||'')}</div></div><div class="fact"><div class="fk">구분</div><div class="fv">${r.scope==='work'?'업무':'개인'}</div></div><div class="fact"><div class="fk">상태</div><div class="fv">${esc(r.status||'발견')}</div></div><div class="fact"><div class="fk">사진</div><div class="fv">${r.images?.length||0}장</div></div></div>${im?`<img id="hero" class="hero" src="${esc(im.url)}"><div class="thumbs">${r.images.map((x,n)=>`<img data-i="${n}" class="${n===i?'on':''}" src="${esc(x.url)}">`).join('')}</div>`:''}<div class="memo"><b>설명 / 메모</b><br>${esc(r.memo||'메모 없음')}</div>`;$('hero')?.addEventListener('click',()=>{$('lbImg').src=$('hero').src;$('lightbox').classList.add('show')});document.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{i=+x.dataset.i;draw()})}draw();$('detail').classList.add('show')}
$('captureBtn').onclick=openCapture;$('sheetCancel').onclick=closeCapture;$('cam').onchange=e=>filesPicked(e.target.files);$('gal').onchange=e=>filesPicked(e.target.files);$('q').oninput=render;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));$('moreBtn').onclick=()=>$('morePanel').classList.toggle('show');$('undo').onclick=()=>{if(hist.length>1){hist.pop();restore(hist[hist.length-1])}};$('del').onclick=()=>{const o=fab?.getActiveObject();if(o&&o!==bgObj){fab.remove(o);fab.discardActiveObject();fab.renderAll();snapshot()}else alert('지울 표시를 먼저 선택하세요.')};$('clear').onclick=()=>{if(!fab)return;fab.getObjects().filter(o=>o!==bgObj).forEach(o=>fab.remove(o));bgObj?.sendToBack();fab.renderAll();snapshot()};$('rotL').onclick=()=>rotatePhoto(-1);$('rotR').onclick=()=>rotatePhoto(1);document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{addLabel(b.dataset.q,30,30,$('color').value);snapshot();setTool('select')});$('edSave').onclick=finishEdit;$('edClose').onclick=$('edCancel').onclick=()=>{if(confirm('편집을 취소할까요?')){$('editor').classList.remove('show');draftImgs=[]}};$('addMore').onclick=()=>{$('metaOv').classList.remove('show');openCapture()};$('metaClose').onclick=$('metaCancel').onclick=()=>{if(confirm('카드 작성을 취소할까요?')){$('metaOv').classList.remove('show');draftImgs=[]}};$('saveCard').onclick=saveCard;$('detailClose').onclick=()=>$('detail').classList.remove('show');$('lbClose').onclick=()=>$('lightbox').classList.remove('show');$('lightbox').onclick=e=>{if(e.target===$('lightbox'))$('lightbox').classList.remove('show')};load();
</script></body></html>
